{{define "layout"}}<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>TYTD Tool</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* = Thiên Long Các · dark ink & gold =
   Mobile-first shell shared by every page. Palette: night ink panels, gold
   leaf accents, jade for “alive”, cinnabar for danger. Serif display titles,
   a 仙 seal, drifting cloud motif — xianxia scroll, not admin template. */
:root{
  --bg:#0a0d12; --panel:#121826; --panel2:#161e2e; --sunk:#0c1119;
  --line:#232e41; --gold:#d4af37; --gold-hi:#f2d98c; --gold-deep:#9a7b25;
  --tx:#ece4d0; --dim:#93a0b5; --faint:#5d6a7e;
  --jade:#3fe0a1; --cinnabar:#ff6a5c; --azure:#7ab8ff;
  --font-d:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Serif",serif;
  --font-b:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --tab-h:62px; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--tx);font:15px/1.55 var(--font-b);
  background:
    radial-gradient(1200px 500px at 85% -120px, rgba(212,175,55,.07), transparent 60%),
    radial-gradient(900px 420px at -15% 108%, rgba(63,224,161,.05), transparent 60%),
    linear-gradient(180deg,#0d1119 0%, var(--bg) 40%, #090c11 100%);
  background-attachment:fixed;
}
/* cloud motif (祥云) under everything, very faint */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="260" height="120" viewBox="0 0 260 120"><g fill="none" stroke="%23d4af37" stroke-opacity="0.05" stroke-width="1.4"><path d="M20 60c0-14 11-25 25-25 3 0 6 1 9 2 4-9 13-15 24-15 14 0 25 11 25 25 10 0 18 8 18 18H20c0-2 0-3 0-5z"/><path d="M31 58c4-6 10-9 17-9"/><path d="M160 100c0-11 9-20 20-20 3 0 5 1 8 2 3-7 10-12 19-12 11 0 20 9 20 20 8 0 14 6 14 14h-81c0-1 0-3 0-4z"/><path d="M169 98c3-5 8-7 13-7"/></g></svg>') repeat 0 0/260px 120px;
}
header{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(13,17,25,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-gold, rgba(212,175,55,.18));
}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.5),transparent)}
.seal{
  width:36px;height:36px;flex:none;border-radius:9px;position:relative;
  display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);
  background:linear-gradient(145deg,#8c2f26,#6d1f1a);
  border:1px solid rgba(240,212,122,.55);
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 0 12px rgba(0,0,0,.35);
  font:700 19px/1 var(--font-d);color:#f2d98c;text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.brand{font:700 17px/1.15 var(--font-d);letter-spacing:.06em}
.brand small{display:block;font:500 10.5px/1.3 var(--font-b);letter-spacing:.22em;color:var(--gold-deep);text-transform:uppercase}
.hspace{flex:1}
/* live wire chip */
#livechip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;
  color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 9px;background:rgba(0,0,0,.25);white-space:nowrap}
#livechip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
#livechip.live .dot{background:var(--jade);box-shadow:0 0 8px var(--jade);animation:pulse 2s infinite}
#livechip.live{color:var(--jade);border-color:rgba(63,224,161,.35)}
#livechip.retry .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#livechip.retry{color:var(--gold)}
@keyframes pulse{50%{opacity:.4}}
.iconbtn{
  width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:19px;height:19px}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px 14px calc(var(--tab-h) + env(safe-area-inset-bottom) + 30px)}
/* ---- cards ---- */
.card{
  position:relative;background:linear-gradient(180deg, var(--panel2), var(--panel) 55%);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px;margin-bottom:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
}
.card::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.45),transparent)}
h1{font:700 19px/1.3 var(--font-d);letter-spacing:.03em;margin:0 0 12px;color:var(--tx);
  display:flex;align-items:center;gap:9px}
h1::before{content:"◆";color:var(--gold);font-size:11px;text-shadow:0 0 8px rgba(212,175,55,.7)}
h2{font:600 11.5px/1.4 var(--font-b);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 9px}
.ok{color:var(--jade)}.err{color:var(--cinnabar)}
.flash{padding:11px 14px;border-radius:12px;margin-bottom:14px;font-size:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent), var(--panel);
  border:1px solid var(--line);transition:opacity .6s}
.flash.ok{border-color:rgba(63,224,161,.45);box-shadow:0 0 18px rgba(63,224,161,.08)}
.flash.err{border-color:rgba(255,106,92,.5);box-shadow:0 0 18px rgba(255,106,92,.08)}
/* ---- forms ---- */
label{display:block;color:var(--dim);font-size:12.5px;letter-spacing:.02em;margin:12px 0 5px}
input[type=text],input[type=password],input[type=number],select{
  width:100%;max-width:440px;background:var(--sunk);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:11px 12px;font-size:16px;font-family:var(--font-b);appearance:none}
input:focus,select:focus{outline:none;border-color:rgba(212,175,55,.6);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" fill="none" stroke="%23d4af37" stroke-width="1.8" stroke-linecap="round"/></svg>');
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);vertical-align:-3px;margin-right:7px}
button{
  background:linear-gradient(180deg,#e8c766,var(--gold) 45%,#b08c22);color:#241b06;
  border:1px solid rgba(242,217,140,.55);border-radius:11px;padding:10px 16px;min-height:42px;
  cursor:pointer;font:600 14px/1.35 var(--font-b);letter-spacing:.02em;
  box-shadow:0 3px 12px rgba(212,175,55,.22), inset 0 1px 0 rgba(255,255,255,.5);
  touch-action:manipulation;transition:transform .08s, filter .15s}
button:active{transform:translateY(1px) scale(.98);filter:brightness(.94)}
button[disabled]{filter:grayscale(.6) brightness(.7);cursor:wait}
button.sec{background:linear-gradient(180deg,#26324a,#1b2434);color:var(--tx);border-color:var(--line);box-shadow:0 3px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06)}
button.danger{background:linear-gradient(180deg,#c04a3f,#8d2c22);color:#ffe6e2;border-color:rgba(255,106,92,.55);box-shadow:0 3px 12px rgba(255,106,92,.2), inset 0 1px 0 rgba(255,255,255,.14)}
button.g{background:linear-gradient(180deg,#4fe8ac,#1fae74);color:#04291b;border-color:rgba(63,224,161,.6);box-shadow:0 3px 12px rgba(63,224,161,.24), inset 0 1px 0 rgba(255,255,255,.4)}
button.mini{padding:6px 11px;min-height:33px;font-size:12.5px;border-radius:9px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.btns form{margin:0}
/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);color:var(--dim);background:rgba(0,0,0,.2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.on{color:var(--jade);border-color:rgba(63,224,161,.45);background:rgba(63,224,161,.07);text-shadow:0 0 10px rgba(63,224,161,.35)}
.pill.off{color:var(--faint)}
.small{font-size:12.5px;color:var(--dim)}
.small a{color:var(--gold)}
code{background:var(--sunk);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:.92em}
a{color:var(--gold)}
/* ---- tables ---- */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--gold-deep);font:600 10.5px/1.4 var(--font-b);letter-spacing:.14em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
td form{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.foot{opacity:.6}
/* ---- toggle rows (one green/red button each) ---- */
.togrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.togrow:last-child{border-bottom:0}
.togl{flex:1;min-width:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.togl .tname{font-size:14px}
.togb{margin:0;flex:none}
/* ---- compact list rows (đệ tử / acc sự kiện) ---- */
.lrow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lmain{flex:1;min-width:0}
.lname{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsub{font-size:12px;color:var(--dim);margin-top:2px}
.lacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lacts form{margin:0}
.lrow .pill{flex:none;margin-top:3px}
/* ---- expandable member config panel (Đệ tử rows) ---- */
.mcfg{margin-top:10px;padding:13px 13px 11px;border:1px solid var(--line);
  border-radius:12px;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.mcfg[hidden]{display:none}
.mcfg h2{margin:0 0 4px}
.mcfg .grid{margin-bottom:2px}
/* ---- bottom tab bar ---- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  background:rgba(13,17,25,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(212,175,55,.16);
  padding:4px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar a{
  flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 5px;border-radius:12px;text-decoration:none;color:var(--faint);
  font:600 10.5px/1.2 var(--font-b);letter-spacing:.03em;position:relative;min-height:46px;
}
.tabbar a svg{width:21px;height:21px}
.tabbar a.on{color:var(--gold)}
.tabbar a.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 8px var(--gold)}
.tabbar a:active{transform:scale(.94)}
/* ---- toggle switches (config rows, owner 2026-11-09: tick boxes → gạt) ---- */
label.sw{display:flex;align-items:flex-start;gap:10px;cursor:pointer;
  margin:11px 0;font-size:13.5px;line-height:1.45;user-select:none}
label.sw input{position:absolute;opacity:0;width:0;height:0}
label.sw i{flex:0 0 auto;margin-top:2px;width:38px;height:22px;border-radius:11px;
  background:rgba(255,255,255,.14);border:1px solid var(--line);position:relative;
  transition:background .18s,border-color .18s}
label.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#e8e2cf;box-shadow:0 1px 3px rgba(0,0,0,.5);
  transition:transform .18s}
label.sw input:checked+i{background:#2ea44f;border-color:#2ea44f}
label.sw input:checked+i::after{transform:translateX(16px)}
label.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
/* ---- toasts (SSE notify) ---- */
#toasts{position:fixed;left:10px;right:10px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:690px;margin:0 auto}
.toast{
  pointer-events:auto;background:rgba(20,26,38,.96);border:1px solid rgba(212,175,55,.4);
  border-left:3px solid var(--gold);border-radius:12px;padding:11px 13px;
  box-shadow:0 12px 30px rgba(0,0,0,.55);animation:tin .28s cubic-bezier(.2,.9,.3,1.2);
  font-size:13.5px;line-height:1.45}
.toast.out{opacity:0;transform:translateY(8px);transition:all .4s}
.toast b{display:block;font:600 10.5px/1.6 var(--font-b);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.97)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="seal">仙</div>
  <div class="brand">TYTD Tool<small>by Đạo Tổ Việt Dart</small></div>
  <span class="hspace"></span>
  <span id="livechip"><span class="dot"></span><span id="livetext">kết nối…</span></span>
  <a class="iconbtn" href="/schedules" title="Lịch biểu" aria-label="Lịch biểu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h3"/></svg>
  </a>
</header>

<main>
{{if .Msg}}<div class="flash {{.MsgKind}}" id="flash">{{.Msg}}</div>{{end}}
{{template "content" .}}
<p class="small foot">Mọi thao tác ở đây giống hệt lệnh trong bot Telegram — trạng thái thật luôn nằm ở server game.</p>
</main>

<nav class="tabbar">
  <a href="/"{{if eq .Path "/"}} class="on"{{end}}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
    Trang chủ</a>
  {{if .IsLeader}}
  <a href="/members"{{if eq .Path "/members"}} class="on"{{end}}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.6 3.3-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.7c2.8.2 4.8 1.9 5.4 4.6"/></svg>
    Đệ tử</a>
  <a href="/events"{{if eq .Path "/events"}} class="on"{{end}}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V10m0 0c0-3 2-5 5-5h2l-1.5-3H18l-1.5 3c1.5.6 2.5 2 2.5 4H5z"/><path d="M5 13h14l-2 4H7z"/></svg>
    Sự kiện</a>
  {{end}}
  <a href="/account"{{if eq .Path "/account"}} class="on"{{end}}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.9-4 3.9-6 7.5-6s6.6 2 7.5 6"/></svg>
    Tài khoản</a>
  <a href="/settings"{{if eq .Path "/settings"}} class="on"{{end}}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.35.95a7 7 0 0 0-2.42-1.4L13.7 2.5h-3.4l-.4 2.64a7 7 0 0 0-2.42 1.4L5.13 5.6l-2 3.46 2 1.55A7 7 0 0 0 5 12c0 .48.05.95.13 1.4l-2 1.55 2 3.46 2.35-.95a7 7 0 0 0 2.42 1.4l.4 2.64h3.4l.4-2.64a7 7 0 0 0 2.42-1.4l2.35.95 2-3.46-2-1.55c.09-.45.13-.92.13-1.4z"/></svg>
    Cài đặt</a>
</nav>

<div id="toasts"></div>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor && tg.setHeaderColor('#0d1119');
      tg.setBackgroundColor && tg.setBackgroundColor('#0a0d12');
    } catch (e) {}
  }
  // Mini-app pages ARE the game board — the shell's header/tabbar/footer are
  // ordinary site chrome and would float over the canvas (they did: users read
  // it as the app "vẽ lệch"). Unauthenticated hits on these paths redirect to
  // /login before this HTML is ever served, so the path test alone is safe.
  // SSE keeps working: the 'tytd:map' bridge below is page-independent, and
  // setLive() is null-guarded for the removed #livechip.
  if (/^\/(kunlun|bacminh|thuongdo|ditich|cuuu|bonglai|thienma|luanhoi|seawarwar)\/?$/.test(location.pathname)) {
    document.querySelectorAll('header, nav.tabbar, main > p.foot').forEach(function (el) { el.remove(); });
    var mm = document.querySelector('main');
    if (mm) { mm.style.maxWidth = 'none'; mm.style.padding = '0'; }
    document.documentElement.classList.add('mini-full');
    var tb = document.getElementById('toasts');
    if (tb) { tb.style.bottom = 'calc(12px + env(safe-area-inset-bottom))'; }
  }
  function haptic(style) {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
  }
  document.addEventListener('click', function (e) { if (e.target.closest('button,.tabbar a,.iconbtn')) haptic('light'); });

  // one submission per form — grey the button out until the server answers.
  // Login forms get an extra force-login gate: game servers hate frantic
  // double logins, so a login action cannot fire again within 3s of the
  // previous one. Every submit ends in a page reload (flash redirect), which
  // would reset a plain variable — hence the timestamp in sessionStorage.
  var LOGIN_GATE_MS = 3000;
  document.addEventListener('submit', function (e) {
    var f = e.target, b = f.querySelector('button[type=submit],button:not([type])');
    var act = f.querySelector('input[name=action]');
    if (act && (act.value === 'login' || act.value === 'login_all')) {
      var last = parseInt(sessionStorage.getItem('tytdLastLoginAt') || '0', 10) || 0;
      var now = Date.now();
      if (now - last < LOGIN_GATE_MS) {
        e.preventDefault();
        toast('Đợi ' + Math.ceil((LOGIN_GATE_MS - (now - last)) / 1000) + ' giây rồi bấm đăng nhập lại nhé…');
        return;
      }
      sessionStorage.setItem('tytdLastLoginAt', String(now));
    }
    if (b && !b.dataset.nodisable) {
      setTimeout(function () { b.disabled = true; b.dataset.oldlabel = b.textContent; b.textContent = 'Đang gửi…'; }, 0);
    }
  });

  // wide tables scroll sideways instead of breaking the card
  document.querySelectorAll('main table').forEach(function (tb) {
    if (tb.parentElement.classList.contains('scrollx')) return;
    var w = document.createElement('div'); w.className = 'scrollx';
    tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
  });

  // success/error flash fades itself away
  var flash = document.getElementById('flash');
  if (flash) setTimeout(function () { flash.style.opacity = '0'; }, 6000);

  /* ---------- Server-Sent Events live wire ---------- */
  var chip = document.getElementById('livechip'), chipTxt = document.getElementById('livetext');
  function setLive(mode) {
    if (!chip) return;
    chip.className = mode;
    chipTxt.textContent = mode === 'live' ? 'trực tiếp' : mode === 'retry' ? 'reconnect…' : 'offline';
  }
  // Owner 2026-10-21: "chỉ thông báo 2 cái ở dưới màn hình thôi, cầm nhiều
  // acc, thao tác nhanh cái này mày gửi thông báo kín cả màn hình" — at most
  // TWO toasts live; a repeat of the same text bumps its ×N counter and
  // refreshes the timer instead of stacking another bubble.
  function toast(text) {
    var box = document.getElementById('toasts');
    if (!box) return;
    var kids = box.children;
    for (var i = kids.length - 1; i >= 0; i--) {
      var k = kids[i];
      if (k.getAttribute('data-t') === text && !k.classList.contains('out')) {
        k.__bump = (k.__bump || 1) + 1;
        var s = k.querySelector('.cnt');
        if (!s) {
          s = document.createElement('span');
          s.className = 'cnt';
          s.style.cssText = 'margin-left:6px;color:var(--gold);font-weight:700';
          k.appendChild(s);
        }
        s.textContent = '×' + k.__bump;
        if (k.__t) clearTimeout(k.__t);
        k.__t = setTimeout(function () { k.classList.add('out'); setTimeout(function () { k.remove(); }, 450); }, 9000);
        return;
      }
    }
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('data-t', text);
    el.innerHTML = '<b>Thông báo</b>' + text.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    box.appendChild(el);
    while (box.children.length > 2) box.removeChild(box.firstChild);
    haptic('medium');
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('message'); } catch (e) {} }
    el.addEventListener('click', function () { el.remove(); });
    el.__t = setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 450); }, 9000);
  }
  function txt(id, s) { var el = document.getElementById(id); if (el) el.textContent = s; }
  function pill(id, on, labelOn, labelOff) {
    var el = document.getElementById(id);
    if (!el) return;
    el.className = 'pill ' + (on ? 'on' : 'off');
    el.textContent = on ? (labelOn || 'BẬT') : (labelOff || 'TẮT');
  }
  // Each toggle is ONE button: green = will turn on, red = will turn off.
  // A state frame rewrites the button's label/colour and the hidden feat
  // the form submits, so the button always shows the next action.
  function setTog(key, on) {
    pill('tog-' + key, on);
    var b = document.getElementById('bt-' + key), f = document.getElementById('feat-' + key);
    if (b) { b.className = on ? 'danger' : 'g'; b.textContent = on ? 'Tắt' : 'Bật'; }
    if (f) f.value = key + (on ? '_off' : '_on');
  }
  function setPeach(T) {
    var on = !!T.peach;
    pill('tog-peach', on, on && T.xave ? 'BẬT + đấu pháp' : 'BẬT', 'TẮT');
    var m = !on ? ['g', 'Chặt', 'chatcay_on'] : T.xave ? ['danger', 'Nghỉ', 'chatcay_off'] : ['', 'Chặt + đấu pháp', 'chatcay_xave_on'];
    var b = document.getElementById('bt-peach'), f = document.getElementById('feat-peach');
    if (b) { b.className = m[0]; b.textContent = m[1]; }
    if (f) f.value = m[2];
  }
  function applyState(st) {
    pill('pill-running', st.running, 'ĐANG CHẠY', 'NGƯNG');
    var T = st.toggles || {};
    setTog('chuot', T.chuot); setTog('notify', T.notify); setTog('maohiem', T.maohiem);
    setTog('lucdao', T.lucdao); setTog('yeuthap', T.yeuthap);
    setTog('huyetmach', T.huyetmach);
    setPeach(T);
    setTog('taydu', T.taydu);
    // Thần Long is a one-shot (no off): pill = run-in-flight, button always
    // fires a new run — the server answers "đang chạy rồi" if one is live.
    (function () {
      var on = !!T.thanlong;
      pill('tog-thanlong', on, 'ĐANG CHƠI', 'NGƯNG');
      var b = document.getElementById('bt-thanlong');
      if (b) { b.className = on ? 'danger' : 'g'; b.textContent = on ? 'Đang chơi…' : 'Chạy ván'; }
    })();
    txt('stat-vip', 'cấp ' + st.vip + (st.vip > 0 && st.vip_expire ? ' — tới ' + st.vip_expire : ''));
    txt('stat-server', String(st.server));
    var uid = document.getElementById('stat-uid');
    if (uid) uid.textContent = st.uid ? 'nhân vật #' + st.uid : 'chưa chọn nhân vật';
    if (st.fleet) {
      txt('fleet-members', st.fleet.members_up + '/' + st.fleet.members);
      txt('fleet-events', st.fleet.events_up + '/' + st.fleet.events);
    }
    // Row pills on Đệ tử / Sự kiện: st.up lists running account ids. Leaders
    // always get the map (empty = everyone off), so rows flip both ways.
    if (st.up) {
      document.querySelectorAll('.rpill').forEach(function (el) {
        var on = st.up[el.getAttribute('data-acc')] === true;
        el.className = 'pill rpill ' + (on ? 'on' : 'off');
        el.textContent = on
          ? (el.getAttribute('data-on') || 'ĐANG CHẠY')
          : (el.getAttribute('data-off') || 'NGƯNG');
      });
    }
    // Per-island status strings on Sự kiện rows (Bồng Lai … Côn Lôn): the
    // server composes the exact line the page template renders (open islands
    // ONLY), so this and a manual reload can never show different text. The
    // leading ' · ' separator lives here/with the template, not in the
    // string — an empty line means every island closed and must WIPE the
    // segment, not leave stale text. Same leader-only rule as st.up.
    if (st.evstat) {
      document.querySelectorAll('[data-isl]').forEach(function (el) {
        var s = st.evstat[el.getAttribute('data-isl')];
        if (typeof s !== 'string') return; // row not in this fleet's frame
        var t = s ? ' · ' + s : '';
        if (el.textContent !== t) el.textContent = t;
      });
    }
  }
  // Live forms (data-live="1": the Công tắc card and the per-member switches
  // on Đệ tử) submit through fetch instead of a full POST→redirect→reload:
  // the JSON answer carries the same state frame the SSE stream sends, and
  // applyState repaints pills, buttons and hidden feats from the server's
  // truth; truths applyState does not carry are repainted page-locally via
  // the 'tytd:live' event below. Every other form — and every browser
  // without JS — keeps the classic reload flow untouched.
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || f.getAttribute('data-live') !== '1' || f._live) return;
    e.preventDefault();
    f._live = true;
    var btn = f.querySelector('button');
    if (btn) { btn.disabled = true; btn.style.opacity = '.55'; }
    var done = function () {
      f._live = false;
      if (btn) { btn.disabled = false; btn.style.opacity = ''; }
    };
    fetch(f.getAttribute('action') || location.pathname, {
      method: 'POST',
      body: new FormData(f), // carries csrf exactly like the plain post
      credentials: 'same-origin',
      headers: { 'X-Tytd-JSON': '1' }
    }).then(function (r) {
      return r.json().catch(function () { return null; });
    }).then(function (j) {
      if (!j || typeof j.ok !== 'boolean') { toast('máy chủ trả về bất thường, thử lại'); return; }
      if (j.state) applyState(j.state);
      if (j.msg) toast(j.msg);
      // Per-page hook: pages whose buttons carry truth that applyState does
      // not know (e.g. the per-member switches on Đệ tử) repaint themselves
      // from this event — the generic frame only covers the shared ids.
      try { window.dispatchEvent(new CustomEvent('tytd:live', { detail: { form: f, json: j } })); } catch (err) {}
    }).catch(function () {
      toast('mất kết nối, vui lòng thử lại');
    }).then(done);
  });

  var es, retry = 0;
  function connect() {
    if (!window.EventSource) return;
    es = new EventSource('/sse');
    es.onopen = function () { retry = 0; setLive('live'); };
    es.addEventListener('state', function (e) {
      setLive('live');
      try { applyState(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener('notify', function (e) {
      try { toast(JSON.parse(e.data).text); } catch (err) {}
    });
    // Live event-map frames ride the same stream; pages listen for this
    // window event instead of touching es (which is recreated on every
    // visibility reconnect).
    es.addEventListener('map', function (e) {
      try { window.dispatchEvent(new CustomEvent('tytd:map', { detail: JSON.parse(e.data) })); } catch (err) {}
    });
    es.addEventListener('expire', function () {
      setLive('off');
      if (es) es.close();
      location.replace('/login');
    });
    es.onerror = function () {
      setLive('retry'); // EventSource auto-reconnects (retry: 3000 from server)
    };
  }
  connect();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (es) es.close(); }
    else { retry = 0; connect(); }
  });
})();
</script>
</body>
</html>{{end}}
