// ---- CastSword / "Luyện Khí Đại Hội" (2048-style weapon-merge board,
// systemOpenId CASTSWORD=119; opcodes 2011901..2011908). Schema recovered
// 2026-10-08 EMPIRICALLY on a live account (CDN .pb.json unreachable):
// requests follow the activityId-first convention; response fields were read
// off the wire with a schema-less walk. The board is 16 ORDERED cells
// (row-major 4x4); cell.level 0 = empty, n = weapon tier n (value 2^n).
// Direction is 1=UP, 2=DOWN, 3=LEFT, 4=RIGHT — pinned by replaying the
// server's own board transitions from the live probe. Each MOVE costs 1
// strength (field 3) and the server secretly spawns fresh tier-1 tiles.
message CastSwordEnterReq { // 2011901
  optional int32 activityId = 1;
}

message CastSwordMoveReq { // 2011902
  optional int32 activityId = 1;
  optional int32 direction = 2; // 1=UP 2=DOWN 3=LEFT 4=RIGHT
}

message CastSwordSettlementReq { // 2011903
  optional int32 activityId = 1;
}

message CastSwordGetRewardReq { // 2011905
  optional int32 activityId = 1;
}

message CastSwordCellInfo {
  optional int32 level = 1; // 0 empty, n = tier n
}

message CastSwordToolInfo { // item counts are DISPLAY only — never spend (item ban)
  optional int32 itemId = 1;
  optional int32 count = 2;
}

message CastSwordBaseData {
  optional int32 score = 1;      // points this run (merge values)
  optional int32 highScore = 2;  // personal best
  optional int32 strength = 3;   // remaining moves this session
  repeated CastSwordCellInfo cells = 4; // exactly 16, row-major
  repeated CastSwordToolInfo tools = 5; // swap/up/break counts
}

message CastSwordEnterResp { // 11901 = "2e7d"
  optional int32 ret = 1;
  optional CastSwordBaseData entity = 2;
  optional int64 refreshTime = 3;    // ms epoch of next strength refresh
  optional int32 rank = 4;           // live: 0 early
  optional int32 nextRankScore = 5;  // live: ~970s (rank ladder target)
}

message CastSwordMoveResp { // 11902 = "2e7e"
  optional int32 ret = 1;
  optional CastSwordBaseData entity = 2;
  optional bool isGameEnd = 3;   // board dead / strength exhausted
  optional int32 field4 = 4;     // live: always 0 so far
}

message CastSwordSettlementResp { // 11903 = "2e7f"
  optional int32 ret = 1;
  optional int32 score = 2;
  optional int32 rank = 3;
}

// ---------------------------------------------------------------------------
// RebornTrial (Luân Hồi Bí Cảnh / 轮回秘境, systemOpenId 172) — caravan
// roguelike with cross-union battle rounds. Schema copied verbatim (field
// numbers) from the game client's protobuf/RebornTrial asset, decoded live
// 2026-10-08 into ../remoteRebornTrial/RebornTrial.decoded.proto. Requests
// 217200..217251, answers = request − 200000. Only the messages the bot
// reads or writes are declared; proto3 skips the rest of the wire.
// ---------------------------------------------------------------------------

message RebornTrialActivityReq {
  int32 activityId = 1;
}

// Answer of ENTER (217201), EXPLORE (217205) and UP_LEVEL (217204 — never
// sent by the bot; levels are auto-granted by the server at exp thresholds).
message RebornTrialDataResp {
  int32 ret = 1;
  optional RebornTrialPlayerData playerData = 2;
}

message RebornTrialPlayerData {
  optional int32 level = 1;
  optional int64 exp = 2;
  optional int64 totalExp = 3;
  optional int32 map = 4;
  optional int32 hp = 5;             // caravan energy (stamina)
  optional int64 hpRecoveryTime = 6;  // ms; energy regen anchor
  repeated RebornTrialMagicItem magicItem = 7;
  repeated RebornTrialGoodsItem goodsItem = 8;
  optional RebornTrialEvent event = 9; // pending event (stat 0 = unresolved)
  optional int32 battleNum = 10;       // free challenges left
  optional int64 battleRecoverTime = 11;
  optional int64 exploreCount = 12;
}

message RebornTrialMagicItem {
  optional int32 magicType = 1;
  optional int32 magicLevel = 2;
  optional int32 cd = 3;
}

message RebornTrialGoodsItem {
  optional int32 id = 1;
  optional int32 goodsId = 2;
  optional int32 level = 3;
  optional int64 value = 4;
  optional int64 price = 5;
  optional int32 quality = 6;
  optional int32 status = 7;
  optional int32 mask = 8;
  optional int32 star = 9;
  optional int32 magicTimes = 10;
}

// event.type: Buy=1 Sell=2 Suppress=3 Relieve(BREAK)=4 Rescue=5 Bet=6(SMELT?)...
// per enum RebornTrialEventType: BUY=1 SELL=2 SUPPRESS=3 BREAK=4 RESCUE=5
// SMELT=6 BET=7 BuyFake=20 SellFake=21 UseMagic=22. stat 0=pending 1=ok 2=fail.
message RebornTrialEvent {
  optional int32 type = 1;
  optional int32 npcId = 2;
  optional int32 stat = 3;
  optional int32 value = 4;
  optional string rewards = 5;
  optional RebornTrialGoodsItem item = 6;
  repeated RebornTrialEventOption option = 7;
  optional int64 param1 = 8;
  optional int64 param2 = 9;
  optional int32 npcType = 10;
}

message RebornTrialEventOption {
  optional int32 order = 1;
  optional int64 costExp = 2;
  optional int32 reduceValue = 3; // energy delta for resolve (negative = gain)
  optional int32 success = 4;
  optional int64 param1 = 5;
  optional int64 param2 = 6;
}

message RebornTrialEnterActivityResp {
  int32 ret = 1;
  optional int32 selfRank = 2;
  optional int32 round = 3;
  optional int32 group = 4;
  optional int32 rankId = 5;
  optional int64 unionId = 6;
  repeated int32 groups = 7;
  optional string unionName = 8;
  optional bool hasWorship = 11;
  optional int32 position = 12;
  optional int32 activityId = 13;
}

message RebornTrialSelectOptionReq {
  int32 activityId = 1;
  int32 selectIndex = 2; // the option's order field
}

message RebornTrialSelectOptionResp {
  int32 ret = 1;
  optional int64 exp = 2;
  optional int32 hp = 3;
  repeated RebornTrialGoodsItem goodsItem = 4;
  optional RebornTrialEvent event = 5;
  optional int32 level = 6;
  optional int64 totalExp = 7;
  repeated RebornTrialMagicItem magicItem = 8;
}

// answer of SKIP_EVENT (217209) — abandons the pending event for free
message RebornTrialSkipEventResp {
  int32 ret = 1;
  optional RebornTrialEvent event = 2;
}

// 217207. magicType 1=sửa (repair, goodsId=instance id), 2=ảo hoá (illusion,
// goodsId=instance id), 3=trấn áp sự kiện (goodsId=0). CD-bearing, free —
// user authorised "có gì dùng hết" 2026-10-09.
message RebornTrialUseMagicReq {
  int32 activityId = 1;
  int32 magicType = 2;
  int32 goodsId = 3; // instance id (field 1 of GoodsItem), 0 for magicType 3
}
message RebornTrialUseMagicResp {
  int32 ret = 1;
  optional RebornTrialGoodsItem goodsItem = 2;
  optional RebornTrialMagicItem magicItem = 3;
  optional RebornTrialEvent event = 4;
}

message RebornTrialWorshipResp {
  int32 ret = 1;
  optional string reward = 2;
}

message RebornTrialUnionBaseMsg {
  optional int64 unionId = 1;
  optional int32 flag = 2;
  optional string name = 3;
  optional int64 serverId = 4;
  optional int64 score = 5;
  optional string masterName = 6;
}

// answer of BATTLE_ENTER (217230): the battle bracket of this round
message RebornTrialChallengeListResp {
  int32 ret = 1;
  repeated RebornTrialUnionChallengeMsg unionMsg = 2;
  repeated int64 advanced = 3;
}

message RebornTrialUnionChallengeMsg {
  optional RebornTrialUnionBaseMsg base = 1;
  optional int64 reduceBlood = 2;
  optional int64 lastBeAttackTime = 3;
  optional int32 rank = 4;
  optional bool hasDefeated = 5;
  optional int64 shieldTriggerTime = 7;
  optional int32 position = 8;
}

message RebornTrialChallengeReq {
  int32 activityId = 1;
  int64 unionId = 2;
}

message RebornTrialChallengeResp {
  int32 ret = 1;
  optional int32 free = 2;
  optional int64 battleRecoverTime = 3;
  optional string rewards = 4;
  optional int64 addScore = 5;
  optional int64 reduceScore = 6;
  optional int32 defeatNum = 8;
  optional int32 activityId = 9;
}

message RebornTrialSendBonusItemReq { // 217223 donate union-tree liquid (phát nước)
  optional int32 activityId = 1;
  optional int32 itemId = 2;    // one of the RENBORNTRIAL_ITEM_ENERGY ids
  optional int32 num = 3;       // client sends 1 per press (long-press repeat)
}

message RebornTrialSendBonusItemResp { // 217223 → 4347
  optional int32 ret = 1;
  optional RebornTrialBonusInfo info = 2; // updated notice for the water board
}

message RebornTrialBonusResp {
  int32 ret = 1;
  optional int32 exp = 2;
  repeated RebornTrialBonusInfo info = 3; // water notices ready to claim
  optional int32 canReceive = 4;
}

// One line of the union tree's water board (BONUS_REQ answer). status 0 =
// unclaimed, id = the GET_BONUS_ITEM argument (id=0 client-side = claim all).
message RebornTrialBonusInfo {
  optional string name = 1;
  optional int32 itemId = 2;
  optional int64 id = 3;
  optional int32 status = 4;
  optional int64 time = 5;
}

message RebornTrialGetBonusResultResp {
  int32 ret = 1;
  optional string reward = 2;
  optional int32 exp = 3;
  optional int32 canReceive = 4;
}

// id = 0 claims every ready water/reward
message RebornTrialGetBonusItemReq {
  int32 activityId = 1;
  int64 id = 2;
}

message RebornTrialGetBonusItemResp {
  int32 ret = 1;
  optional string reward = 2;
  optional int32 canReceive = 4;
}

// 217208 USE_ITEM — the ONLY sanctioned send is the owner's explicit
// "/luanhoi_ve" ticket command (challenge-count ticket, item id from
// RENBORNTRIAL_CHALLENGE_ITEM). Auto loops NEVER send it [[tytd-item-ban]].
message RebornTrialUseItemReq {
  int32 activityId = 1;
  optional int32 itemId = 2;
  optional int32 num = 3;
}
message RebornTrialUseItemResp {
  int32 ret = 1;
  optional int32 value = 2;              // stamina restored (energy item)
  optional int64 lastRecoveryTime = 3;
  optional int32 battleNum = 4;          // challenges left after use
}

// 217232 BATTLE_HEART — scene keep-alive, ret-only answer 4350.
message RebornTrialChallengeHeartBeatReq {
  int32 activityId = 1;
}
message RebornTrialChallengeHeartBeatResp {
  int32 ret = 1;
}

// 217231 BATTLE_UNIONPLAYER — the base's stationed members. LIVE WIRE (answer
// 434f, 2026-10-09): ret=1, then unmodeled server-version scalars, and the
// member list rides field 7 (the decoded CDN .proto says 2 — the wire wins).
message RebornTrialUnionPlayerListReq {
  int32 activityId = 1;
  optional int64 unionId = 2;
}
message RebornTrialUnionBattlePlayerMsg {
  optional int32 appearanceId = 1;
  optional int32 cloudId = 2;
  optional int64 exp = 3;
  optional string nickName = 4;
}
message RebornTrialUnionPlayerListResp {
  int32 ret = 1;
  repeated RebornTrialUnionBattlePlayerMsg playerList = 7;
}

// The base fields a fight push names (answer-free server push).
message RebornTrialUnionChallengeSimpleMsg {
  optional int64 unionId = 1;
  optional int64 leftHp = 2;
  optional int64 finalFame = 3;
  optional bool hasDefeated = 4;
  optional int64 shieldTriggerTime = 5;
  optional int32 level = 6;
}

// 217234 BATTLE_NOTIC_SYNC push: "X's union hit base Y for D".
message RebornTrialChallengeInfoSync {
  optional int64 playerId = 1;
  optional string unionName = 2;
  optional string name = 3;
  repeated int64 advanced = 4;
  optional RebornTrialUnionChallengeSimpleMsg targetUnion = 6;
  optional int64 damage = 8;
}

message RebornTrialGuessDataResp {
  int32 ret = 1;
  repeated int64 unionIdArr = 3;
  repeated int32 rewardRankAchieve = 4;
  optional bool isReceive = 5;
}

message RebornTrialGuessRewardResp {
  int32 ret = 1;
  optional string rewards = 2;
}

// AUTO_EXPLORE (217251). settingItems mirrors the client defaults; the
// engine sends the client's own table (see player_reborntrial.go).
message RebornTrialAutoSettingItem {
  int32 event = 1;
  repeated int32 EventSetting = 2;
}

message RebornTrialAutoExploreReq {
  int32 activityId = 1;
  repeated RebornTrialAutoSettingItem settingItems = 2;
}

message RebornTrialAutoResultMsg {
  int32 ret = 1;
  repeated int32 codes = 2;
  repeated bytes msgs = 3;
}

message RebornTrialAutoExploreRsp {
  int32 ret = 1;
  optional RebornTrialPlayerData playerData = 2;
  optional int32 stopType = 3;
  repeated RebornTrialAutoResultMsg results = 4;
  optional int32 hp = 5;
}

// uniqueConfig of the 21003 detail answer (RebornTrialConfigSync).
message RebornTrialLevelConfig {
  optional int32 level = 1;
  optional int64 exp = 2;
  optional int32 map = 3;
  optional string treasure = 4;
  optional int32 cost = 5; // energy spent per explore at this level
  optional string goodsLevel = 6;
  optional string event = 7;
  optional string refusePower = 8;
  optional string moneyRange = 9;
  optional int64 moneyTriggerBound = 10;
  optional int64 score = 11;
}

message RebornTrialTimeConfig {
  optional int32 timeId = 1;
  optional int32 type = 2;      // 1 SignIn, 2 Prepare, 3 Battle round
  optional int32 beginTime = 3; // hours offset from activity begin
  optional int32 durationTime = 4; // hours
  optional string param = 5;
}

// ItemConfig row — the client's getGoodsConfig(): isMagic>0 marks the
// dharma-treasure goods themselves (never repair/illusion candidates).
message RebornTrialItemConfig {
  optional int32 itemId = 1;
  optional int64 priceRate = 2;
  optional int32 isMagic = 3;
}

message RebornTrialConfigSync {
  int32 activityId = 1;
  repeated RebornTrialLevelConfig levelConfig = 2;
  repeated RebornTrialItemConfig itemConfig = 4;
  repeated RebornTrialTimeConfig timeConfig = 9;
}

// ---- Đan Giới / Linh Điền (Elixir, 235500-series) ----
// Schema from ../remoteElixir/Elixir.decoded.proto (mined from CDN TextAsset,
// owner audit 2026-10-16). Resp opcode = req % 100000 (ENTER_HOME 235502→8aae,
// PLANT 235504→8ab0, WATER 235505→8ab1, GET 235506→8ab2). ElixirGetTimeWaterReq
// already exists above (player_water.go) — NOT redeclared. Subset of fields the
// auto loop reads; unknown fields ride past (proto3 open).
//
// Gameplay model (owner-confirmed): plants SELF-GROW on a timer — watering is an
// OPTIONAL instant speed-up, never required, so never hoard water. DƯỢC LINH =
// Elves (药灵): a plant only rolls the spirit herb if isPlantElves was ticked at
// plant time; server caps 30/day, so the bot always sets the flag and lets the
// server zero it out.

// PlayerHeadAndNameMsg subset — only what the loop needs to ignore/label.
message ElixirPlayerHead {
  optional int64 playerId = 1;
  optional string name = 2;
}

message ElixirGrassInfo {
  optional int32 grassId = 1;
  optional int32 lv = 2;
  optional int32 num = 3;
}

message ElixirLandInfo {
  optional int32 landId = 1;
  optional int32 state = 2;
  optional int32 grassId = 3;
  optional int32 grassLv = 4;
  optional int64 roundStartTime = 5;
  optional int32 canAwardRound = 6;
  optional int32 elvesNum = 7;
  optional bool canRob = 8;
  optional int32 hadReceiveRound = 9;
  optional int32 canAwardElvesNum = 10;
}

message ElixirUserInfo {
  optional ElixirPlayerHead playerInfo = 1;
  optional int32 exp = 2;
  optional int32 water = 3;
  optional bool elvesOpenOff = 4;
  repeated ElixirGrassInfo grassInfos = 5;
  optional int32 dailyRobNum = 6;
  optional int32 waterBucket = 11;
  optional int64 lastRecoverWaterBucketTime = 12;
}

message ElixirEnterHomeReq {
  optional int64 playerId = 1;
}

message ElixirLandRoundAward {
  optional string reward = 1;
  optional int32 speed = 2;
  optional string lvReward = 3;
}

message ElixirLandReward {
  optional int32 landId = 1;
  repeated ElixirLandRoundAward roundAwards = 2;
}

// Đơn hàng Dược Tiên (owner 2026-10-17 bug round): the order panel inside
