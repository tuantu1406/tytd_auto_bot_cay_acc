  optional int32 ret = 1;
  optional string reward = 2;
}

// 209508 rank-reward state / 209509 claim result.
message HolyLandPlayerUnionRankRewardRespMsg {
  optional int32 ret = 1;
  optional int32 unionRank = 2;
  optional int32 unionScore = 3;
  optional bool hasReward = 4;
  optional bool isEnterMap = 5;
}

message HolyLandGetPlayerUnionRankRewardRespMsg {
  optional int32 ret = 1;
  optional string reward = 2;
}

// ---- pushes ----

// HolyLandUnionSimpleInfo: owner shape inside city-change pushes (distinct
