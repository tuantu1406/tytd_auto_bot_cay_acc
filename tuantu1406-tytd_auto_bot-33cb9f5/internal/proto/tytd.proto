  optional bool notFoundCrossId = 7;
}

message HolyLandBattleTimeStampsDataSyncMsg {
  optional int32 ret = 1;
  repeated int64 scheduleTimestamp = 2;
}

// 209511 worship (bái tế) — pure perk, no combat decision.
