// The 53xxxx/55xxxx ct506 "hoàn thành N đơn hàng Dược Tiên" tasks ride this
// panel. Subset of Elixir.decoded.proto; the bot reads the required grassIds
// (plant-the-right-tree) AND auto-submits destiny orders (235515, owner
