  SeaWarPlayerDataMsg playerData = 2;
}

message SeaWarWorshipResp {
  int32 ret = 1;
  string reward = 2;
}

// Folded from detailConfig.uniqueConfig (the client's "excel config"):
// soulBall table (forge priority) + region table (energy, unlock).
message SeaWarBuffConfigMsg {
  int32 id = 2;
  int32 type = 4;
  int32 effect = 5;
}

message SeaWarRegionConfigMsg {
  int32 id = 2;
  int32 energy = 4;
  string consumeCondition = 6;
}

message SeaWarConfigSync {
  repeated SeaWarBuffConfigMsg seaWarBuffConfigMsgs = 2;
  repeated SeaWarEventConfigMsg seaWarEventConfigMsgs = 3;
  repeated SeaWarRegionConfigMsg seaWarRegionConfigMsgs = 6;
}

// ─── SeaWar assist + event config (field numbers verbatim from the
// xor-1 SeaWar TextAsset; PlayerHead entries are opaque — only the list
// length is read, per the client's help-box render). ────────────────────
message SeaWarPlayerHeadRef {}

message SeaWarHelpBoxMsg {
  int64 assistId = 1;
  int64 assistTime = 2;
  repeated SeaWarPlayerHeadRef helpUsers = 3;
  int64 playerId = 4;
  int32 eventId = 5;
  bool isReceive = 6;
  int32 regionId = 7;
  string playerName = 8;
}

message SeaWarUnionHelpPlayerEntity {
  string nickName = 1;
  int32 appearanceId = 2;
  string unionName = 3;
  SeaWarPlayerHeadRef headInfo = 4;
  int32 backOrnamentId = 5;
}

message SeaWarAssistMsg {
  int64 assistId = 1;
  int32 monsterConfigId = 2;
  string hp = 3;
  string leftHp = 4;
  string nickName = 5;
  int64 assistTime = 6;
  repeated SeaWarPlayerHeadRef helpUsers = 7;
  int64 playerId = 8;
  int32 eventId = 9;
  int64 targetPlayerId = 10;
  SeaWarUnionHelpPlayerEntity targetPlayer = 11;
  string maxHp = 12;
  bool isKilled = 13;
  bool isReceive = 14;
  int32 regionId = 15;
}

message SeaWarAssistData {
  SeaWarHelpBoxMsg helpBoxInfos = 1;
  SeaWarAssistMsg assistInfos = 2;
  int32 type = 3;
}

message SeaWarAssistListResp {
  int32 ret = 1;
  repeated SeaWarAssistData data = 2;
  int32 assistTimes = 3;
  int32 helpBoxCount = 4;
}

message SeaWarAssistReq {
  int32 activityId = 1;
  // type=0 IS a value (fight assist, swAssistFight) — presence law as above.
  optional int32 type = 2;
  optional int64 targetPlayerId = 3;
  optional int64 id = 4;
}

message SeaWarAssistRsp {
  int32 ret = 1;
  repeated SeaWarAssistData data = 2;
  int32 assistTimes = 3;
  string reward = 4;
  int32 activityId = 5;
  int32 helpBoxCount = 6;
}

message SeaWarAssistRewardReq {
  int32 activityId = 1;
  // presence law: type=0 = fight-reward claim.
  optional int32 type = 2;
  optional int64 id = 3;
}

message SeaWarAssistRewardRsp {
  int32 ret = 1;
  repeated SeaWarAssistData data = 2;
  string reward = 3;
  int32 activityId = 4;
  repeated SeaWarBuffBallMsg buffBalls = 5;
}

message SeaWarEventConfigMsg {
  int32 activityId = 1;
  int32 id = 2;
  int32 eventType = 3;
  string param = 4;
  string reward = 5;
  int32 score = 6;
  int32 exp = 7;
  int32 protect = 8;
  int32 points = 9;
  string name = 10;
  string desc = 11;
}

// ─── SeaWar chiến trường khiêu chiến (234931..234944) ──────────────────
// ORDER-ONLY family (low16 0x95b3..0x95c0 hard ban on the auto engine —
// [[tytd-item-ban]]): these packets leave the socket ONLY from a sanctioned
// web order (bấm nhà trên map). Field numbers verbatim from the xor-1
// SeaWar TextAsset; PlayerBaseDataMsg/BattleRecordMsg are shared types
// modelled as label-only subsets (SkyTradePlayerBase pattern).
message SeaWarPlayerBaseData {
  int64 playerId = 1;
  string nickName = 3;
  int64 serverId = 8;
}

message SeaWarBattleRecordRef {} // client's full BattleRecordMsg not modelled

message SeaWarPersonalRankInfo {
  SeaWarPlayerBaseData playerBaseDataMsg = 1;
  int32 rank = 2;
  int64 score = 3;
}

message SeaWarUnionBaseData {
  int64 unionId = 1;
  int32 flag = 2;
  string name = 3;
  int64 serverId = 4;
  string masterName = 5;
}

message SeaWarDeclarationTargetInfo {
  int64 targetUnionId = 1;
  int32 count = 2;
}

message SeaWarUnionChallengeMsg {
  SeaWarUnionBaseData base = 1;
  int32 rank = 2;
  repeated SeaWarDeclarationTargetInfo targetInfos = 3;
  int32 positionRank = 4;
}

message SeaWarChallengeListResp {
  int32 ret = 1;
  repeated SeaWarUnionChallengeMsg unionMsg = 2;
  repeated SeaWarChallengeInfoSync infos = 3;
  SeaWarPersonalRankInfo rankInfo = 5;
  int64 lastNormalUnionId = 6;
  int64 lastAdvancedUnionId = 7;
  repeated int64 canBattleUnionIds = 8;
  int32 freeNormalTimes = 9;
}

message SeaWarUnionGroupRankMsg {
  int64 unionId = 1;
  int32 rank = 2;
}

message SeaWarChallengePlayerDataMsg {
  // field 1 (PlayerHeadDataMsg) opaque — labels only.
  int32 appearanceId = 2;
  string nickName = 3;
  int32 equipCloudId = 4;
}

message SeaWarChallengeInfoSync {
  int64 playerId = 1;
  string unionName = 2;
  string name = 3;
  SeaWarChallengePlayerDataMsg appearance = 4;
  int64 targetUnionId = 5;
  string damage = 6;
  repeated SeaWarUnionGroupRankMsg groupRankMsg = 7;
  SeaWarPersonalRankInfo rankInfo = 8;
  SeaWarBeChallengedInfo beChallengedInfo = 9;
}

message SeaWarBeChallengedInfo {
  SeaWarPlayerBaseData playerBaseDataMsg = 1;
  int32 rank = 2;
  int32 roomId = 3;
  int32 defeatedNum = 4;
}

message SeaWarDeclarationInfo {
  SeaWarPlayerBaseData playerBaseDataMsg = 1;
  // Owner law 2026-11-11: attempt counts are NEVER a local gate — the
  // server ret is the sole arbiter ("không cần check xem có lượt hay không").
  int32 challengeTimes = 2;
  int32 roomId = 3;
  int32 type = 4;
  int64 time = 5;
}

message SeaWarEnterChallengeReq {
  int32 activityId = 1;
  int64 unionId = 2;
}

message SeaWarEnterChallengeResp {
  int32 ret = 1;
  SeaWarPersonalRankInfo personalRankInfo = 2;
  repeated SeaWarDeclarationInfo declarationInfos = 3;
}

message SeaWarRoomInfoReq {
  int32 activityId = 1;
  int64 unionId = 2;
  int32 roomId = 3;
}

message SeaWarRoomInfoResp {
  int32 ret = 1;
  repeated SeaWarBeChallengedInfo beChallengedInfos = 2;
}

message SeaWarChallengeReq {
  int32 activityId = 1;
  int64 unionId = 2;
  int32 roomId = 3;
  int64 playerId = 4;
}

message SeaWarChallengeResp {
  int32 ret = 1;
  SeaWarBattleRecordRef battleRecordMsg = 2;
  string rewards = 3;
  string damage = 4;
  int32 activityId = 5;
  int32 unionScore = 6;
}
// DECLARATION 234944 (tuyên chiến — the client's "chọn lệnh" step: type
// 0=lệnh thường / 1=lệnh cao cấp, isFree=free-normal command; MUST precede
// CHALLENGE_BATTLE or the server refuses the challenge). Outbound presence
// law: type=0 / isFree=false are real values → optional + wrapper-set.
message SeaWarDeclarationReq {
  optional int32 activityId = 1;
  optional int64 unionId = 2;
  optional int32 type = 3;
  optional bool isFree = 4;
}
message SeaWarDeclarationResp {
  optional int32 ret = 1;
  optional int32 activityId = 2;
  optional int32 type = 3;
  optional int32 freeNormalTimes = 4;
  optional bool isFree = 5;
}
