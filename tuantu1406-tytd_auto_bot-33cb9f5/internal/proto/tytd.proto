syntax = "proto3";

package proto;
option go_package = ".;proto";

message Auth {
  string token = 1;         // "N9CtwdADoIRvPw5McjF-l"
  string locale = 2;     // "vi_vn"
  optional bool status = 3;      // 0
}

message GiftList {
  repeated GiftEntry entries = 1;
}

message GiftEntry {
  string gift_code = 1; // e.g. "PALACE-GIFT-710550-71055065276-oixwd"
  int32 gift_type = 7;
}

message GiftCode {
  string code = 1;      // "PALACE-GIFT-710395-71039566089-hunfv"
  bool status = 2;     // 1 (e.g., active)
  int32 type = 3;       // 1 (e.g., category or kind of gift)
}

message SubMessage {
  int32 subfield1 = 1;
  int32 subfield2 = 2;
}

message VedaoEND {
  uint64 id = 1;
  bool win = 2;
  int32 count = 3;
  int32 category = 4;
  int32 level = 5;
  int32 score = 6;
  int32 lacqua = 7;
  int32 modifier = 8;
}

message VedaoInfo3 {
  int32 item = 1;
  int32 level = 2;
}

message VedaoInfo2 {
  repeated VedaoInfo3 info = 3;
  int32 level = 4;
  int32 loz_gi_deo_biet = 6;
}

message VedaoInfo1 {
  VedaoInfo2 info = 1;
}

message VedaoInfo {
  VedaoInfo1 info = 2;
}

message VedaoStart {
  uint64 id = 1;
}

////player info

message PlayerInfo {
  int64 uid = 1;                // 1000000000000
  string unicode_str = 2;             // "✢★✢Lẹnhlüng"
}


//// phuc dia


message List1PhucDiaItem {
  uint64 uid = 1;
}

message MouseInfo {
  int32 free = 1;
  int32 total = 2;
  int32 hp = 3;
}


message NguoiKeoInfo {
  fixed64 timestamp = 1;                  // e.g., 0xA4ABD4D98802 (1111111111111)
  string unicode_str = 2;                 // "✢★✢Lẹnhlüng"
  int32 version = 3;                      // 0xABB107 (123456)
  int32 status = 4;                       // Usually 1
  int32 type = 5;                         // Usually 1
  bytes empty_data = 6;
  MetadataExtension extension = 7;
}

message MetadataExtension {
  fixed64 timestamp = 1;
  int32 version = 2;
  bytes empty_field = 3;
  int32 status = 4;
  int32 type = 5;
}

message PhucDiaItem {
  string item = 1;                          // e.g., "100029=1", "100004=3"
  int32 entry_type = 2;                   // Values: 1, 2, 4
  int64 timestamp_offset = 3;              // Varint (sometimes negative)
  int32 offset = 4;                       // Values 0-5
  //  int32 category = 5;                     // Usually 3, sometimes 4
  //  int32 flags = 6;                        // Always 0 in this data
  //  oneof timestamp_data {
  //    fixed64 fixed_timestamp = 7;          // When no metadata
  //    NguoiKeoInfo metadata = 8;           // Present in entries 2 and 6
  //  }
  //  int32 final_flag = 9;                   // Always 0
}

message PhucDiaInfo {
  bool oke = 1;
  repeated PhucDiaItem entries = 2;         // 6 entries in this data
  int64 main_timestamp = 3;               // 0x80DBFAF18A33 (varint)
  //GlobalMetadata global_metadata = 4;
  //int64 received_timestamp = 6;
}

message MyPhucDiaInfo {
  PhucDiaInfo info = 1;
}

message GlobalMetadata {
  fixed64 timestamp = 1;
  string unicode_str = 2;                 // "✢★✢Lẹnhlüng"
  int32 version = 3;                      // 123456
  bytes empty_field1 = 4;
  MetadataExtension extension = 5;
  int32 status_byte = 6;                  // 0xC4
  int32 type_byte = 7;                    // 0xC5
  int32 additional_flags = 8;             // 0x00
}

message ChuPhucDiaInfo {
  uint64 id = 1;
}

message PhucDiaKhacInfo {
  ChuPhucDiaInfo cinfo = 1;
  repeated int32 items = 2;
  bool dangkeo = 3;
}

message AllPhucDiaKhacInfo {
  repeated PhucDiaKhacInfo phucdiabencanh = 1;
  repeated PhucDiaKhacInfo phucdiadoidich = 2;
}

message AllPhucDia {
  int32 zz = 1;
  AllPhucDiaKhacInfo info = 2;
}

message ChayChuot {
  uint64 id = 1;
  optional int32 offset = 2;
  optional bool oke = 3;
}


message ChuotDangKeo {
  int32 offset = 4;
  uint64 timestamp = 8;
  uint64 id = 9;
}

message DanhSachChuotDangkeo {
  repeated ChuotDangKeo entries = 1;
}

message VentureResult {
  bool oke = 3;
}

message LucDaoStart {
  bool oke = 1;
}

message LucDaoResult {
  string value = 2;
}


message TinhTuc {
  int64 id = 1;
}

message YeuThap {
  int32 error = 1;
  bool oke = 3;
}

message PickSkillYeuThap {
  int64 skill = 1;
}

message PhanThan {
  int32 id = 1;
}


message GhepDo {
  int32 id = 1;
  string soluong = 2;
}

message LikeTienCu {
  uint64 id = 1;
  bool oke = 2;
}

message BuffDao {
  uint64 id = 1;
}

message ClanInfo {
  uint64 id = 1;
  string Name = 4;
}

message ClanMember {
  uint64 id = 1;
  string Name = 3;
}

message ClanMemberInfo {
    ClanMember member = 1;
    uint64 last_active = 2;
}

// Request: S_GET_CLAN_INFO (0x00005656)
message GetClanInfo {
  uint64 clan_id = 1;
}

// Response: SERVER_CLAN_INFO_2 (0x0836)
message ClanInfoResponse {
  uint32 status = 1;  // 0 = success
  MClanInfo clan_data = 2;
}

message MClanInfo {
    ClanInfo info = 1;
    repeated ClanMemberInfo member = 4;
}

message ChatCay {
  optional int32 zz = 1;
  int32 oke =3;
}

message L3 {
  int32 id = 1;
}

message L2 {
  L3 l3 = 1;
}

message L1 {
  repeated string items = 1;
  L2 l2 = 2;
}

message  ChatCayResponse {
  int32 error = 1;
  repeated L1 l1 = 2;
}

message L2Khongitems {
  int32 id = 1;
}

message L1Khongitems {
  L2Khongitems l2 = 1;
}

message DoChuaHuyResponse {
  int32 error = 1;
  repeated L1Khongitems l1 = 2;
}

message HuyDoChatCay {
  int32 oke = 1;
  repeated int32 id =2;
}

message KhieuChienDauPhap {
  optional int32 id = 1;
}

message GiamCay {
  int32 var1 = 1;
  int32 var2 = 2;
  optional int32 var3 = 3;
}

message PhatNgoc {
  string Msg = 1;
}



message BangTreoThuongNhiemVu {
  optional int32 id = 1;
}


message BangTreoThuongInfo {
  optional bool done = 1;
}

message QuayTinhQuaiQuangCao {
  int32 var1 = 1;
  int32 var2 = 2;
  optional int32 var3 = 3;
}

// ---- God Island (đảo bất tử) event ----
// Schemas from ../remoteBlessFrog/GOD_ISLAND_PROTOCOL.md. The game uses proto2
// required fields; proto3 doesn't enforce them, which is fine for us. Only the
// fields we consume are declared, everything else is skipped as unknown.

// Activity config push (transport 03e9/040c): PushActivityList /
// SyncActivityList share this layout. God Island entries have type 68
// (333 = peak island).
message ActivityMainConfig {
  optional int32 activityId = 1;
  optional int32 type = 2;
  // Window fields from ActivityBase.decoded.proto: the client derives the
  // activity phase (show/active/reward) from these; we store them so status
  // checks do not need the full config push again.
  optional int32 childType = 3;
  optional int64 beginShowTime = 4;
  optional int64 endShowTime = 5;
  optional int64 beginTime = 6;
  optional int64 endTime = 7;
  optional int32 groupType = 9;
}

message PushActivityList {
  repeated ActivityMainConfig mainConfig = 1;
}

message GodIslandBaseInfoReqMsg {
  int32 activityId = 1;
}

// resp of 206801 (incoming type 1a91)
message GodIslandBaseInfoRespMsg {
  int32 ret = 1;
  optional int32 activityId = 2;
  optional int32 selfRank = 3;
  optional int32 group = 4;
  optional int32 floor = 5;
  optional int64 unionId = 6;
}

message GodIslandHeartBeatReqMsg {
  int32 activityId = 1;
}

// S_GOD_ISLAND_GAME_INFO_LOAD (206820, incoming 1aa4). Only the scalar fields
// we consume are modeled; protobuf skips the rest (repeated/sub-messages).
message GodIslandGameInfoReqMsg {
  int32 activityId = 1;
}

message GodIslandGameInfoRespMsg {
  int32 ret = 1;
  // account's base city on this island — differs between the normal (Bồng
  // Lai) and peak (Thiên Ma) variants, so it is cached per event.
  optional int32 home = 2;
  optional GodIslandGameRouteInfo myRouteInfo = 5;
  optional bool leftout = 7;
  optional int32 location = 8;
  optional int32 speedUpCount = 9;
  optional string curPower = 12;
  optional string maxPower = 13;
  optional int64 reviveTime = 20;
}

// My march route; presence in GodIslandGameInfoRespMsg means the unit is
// moving (myRouteInfo != nil is the server's accelerate precondition). Only
// the scalars we consume are modeled.
message GodIslandGameRouteInfo {
  optional int64 playerId = 1;
  optional int32 fromCityId = 2;
  optional int32 toCityId = 3;
  optional int64 time = 4;
  optional int64 arrival = 5;
  optional int64 unionId = 6;
  optional int32 currentRank = 8;
  optional string name = 9;
  optional bool suppressBuff = 10;
}

// S_GOD_ISLAND_GAME_ACCELERATE_MOVE (206849, incoming 1ac1)
message GodIslandGameAcclerateMoveReqMsg {
  int32 activityId = 1;
  optional int32 speedUpCount = 2;
}

message GodIslandGameAcclerateMoveRespMsg {
  int32 ret = 1;
  optional string costInfo = 2;
  optional int32 speedUpCount = 3;
}

message GodIslandGameMoveReqMsg {
  int32 activityId = 1;
  int32 targetId = 2;
}

message GodIslandGameAutoAttackReqMsg {
  int32 activityId = 1;
  int32 targetId = 2;
  optional bool onlyNpc = 3;
}

// S_GOD_ISLAND_GAME_USE_FRUIT (206837)
message GodIslandUseFruitReq {
  int32 activityId = 1;
  int32 useCount = 2;
}

message GodIslandUseFruitResp {
  int32 ret = 1;
  optional string costInfo = 2;
  optional string ballCurPower = 3;
  optional string ballMaxPower = 4;
}

// S_GOD_ISLAND_GAME_SPIRITUALBALL_INFO (206826, incoming 1aaa)
message GodIslandGameSpiritualBallInfoReqMsg {
  int32 activityId = 1;
}

message GodIslandGameSpiritualBallInfoRespMsg {
  int32 ret = 1;
  optional string curPower = 2;
  optional string maxPower = 3;
  optional string ballCurPower = 4;
  optional string ballMaxPower = 5;
}

// S_GOD_ISLAND_GAME_USE_SPIRITUALBALL (206827, incoming 1aab)
message GodIslandGameUseSpiritualBallReqMsg {
  int32 activityId = 1;
  optional int64 usePower = 2;
}

message GodIslandGameUseSpiritualBallRespMsg {
  int32 ret = 1;
  optional string curPower = 2;
  optional string ballCurPower = 3;
}

// ---- Plant / liquid (vườn linh thảo) — schemas from GOD_ISLAND_PROTOCOL.md
// sections 206836/206838/206839/206851 and GodIsland.decoded.proto:671,791.

// Plant notice: one liquid sent or received. status 0 = pending (not yet
// watered/collected), 1 = received.
message GodIslandGamePlantNoticeInfo {
  optional string name = 1;
  optional int32 liquidId = 2;
  optional int64 id = 3;
  optional int32 status = 4;
  optional int64 time = 5;
}

// S_GOD_ISLAND_GAME_PLANT_INFO (206836, incoming 1ab4): water-plant state,
// pending liquid notices, and whether the fruit is ready.
message GodIslandGamePlantInfoReqMsg {
  int32 activityId = 1;
}

message GodIslandGamePlantInfoRespMsg {
  int32 ret = 1;
  optional int32 lv = 2;
  optional int32 exp = 3;
  repeated GodIslandGamePlantNoticeInfo noticeInfo = 4;
  optional int32 canReceive = 5; // 1 = fruit ready to claim
  optional int32 waterCount = 6; // liquid watered so far
}

// S_GOD_ISLAND_GAME_PLANT_WATER (206839, incoming 1ab7): collect one pending
// notice by its noticeInfo.id (NOT the liquidId); id = 0 collects all pending
// once the server's quick-receive condition (GODISLAND_QUICK_CLICK) is met.
message GodIslandGamePlantWaterReqMsg {
  int32 activityId = 1;
  int64 id = 2;
}

message GodIslandGamePlantWaterRespMsg {
  int32 ret = 1;
  optional string reward = 2;
  optional int32 exp = 3;
  optional int32 canReceive = 4;
  optional int32 lv = 5;
  optional int32 waterCount = 6;
}

// S_GOD_ISLAND_GAME_PLANT_RECEIVE_FRUITS (206838, incoming 1ab6): claim the
// completed plant reward while canReceive == 1.
message GodIslandGamePlantReceiveFruitsReqMsg {
  int32 activityId = 1;
}

message GodIslandGamePlantReceiveFruitsRespMsg {
  int32 ret = 1;
  optional string reward = 2;
  optional int32 lv = 3;
  optional int32 exp = 4;
  optional int32 canReceive = 5;
}

// S_GOD_ISLAND_GAME_PLANT_SEND_LIQUID (206851, incoming 1ac3): donate one
// liquid item; liquidId is a key of the GODISLAND_ITEM_ENERGY activity
// config, sendNum is always 1 in the official client (button repeat sends
// again). No recipient field — the server routes it by union/event logic.
message GodIslandGameSendLiquidReqMsg {
  int32 activityId = 1;
  int32 liquidId = 2;
  int32 sendNum = 3;
}

message GodIslandGameSendLiquidRespMsg {
  int32 ret = 1;
  optional GodIslandGamePlantNoticeInfo noticeInfo = 2;
}

// ---- Server event pushes (incoming types 1ac2/1ac9/1acd/1acf) ----

// MYGAMEINFO_SYNC (206850, incoming 1ac2): the server's own state push for
// this account — the push that confirms a revive/movement transition (see
// ../remoteImmortalIsland/STATIC_ANALYSIS.md "Spiritual Ball recovery and
// revival"), arriving before the 3s INFO_LOAD poll would notice.
message GodIslandGameMyGameInfoSyncMsg {
  int32 activityId = 1;
  optional int32 location = 2;
  optional string curPower = 3;
  optional string maxPower = 4;
  optional int64 attackCd = 5;
}

// LEFT_OUT_SYNC (206857, incoming 1ac9): a union left/was removed from the
// island (own unionId = we were kicked out).
message GodIslandLeftOutSyncInfo {
  int32 activityId = 1;
  int64 unionId = 2;
}

// BEEN_KILL_SYNC (206861, incoming 1acd): our unit died on the island;
// reviveTime is the new revive deadline (epoch ms).
message GodIslandBeenKillSyncMsg {
  int32 activityId = 1;
  optional int32 cityId = 2;
  optional int64 targetId = 3;
  optional string targetName = 4;
  optional bool killByNPc = 5;
  optional int64 reviveTime = 6;
}

// AUTO_BATTLE_STOP_SYNC (206863, incoming 1acf): auto battle stopped.
message GodIslandAutoBattleStopSyncMsg {
  int32 activityId = 1;
}

// S_ACTIVITY_GET_DATA (21003, incoming 03eb) request: fetches the activity
// detail config; GODISLAND_ITEM_ENERGY (format
// "liquidItemId|energyValue;..." per index.5d668.pretty.js:106937) lives in
// its commonConfig.paramConfig. Field numbers below confirmed live against
// activity 9061675 (raw-walked RspGetActivityDetail, see live_plant_test.go).
message ReqGetActivityDetail {
  int32 activityId = 1;
  optional string version = 2;
}

message ActivityParamConfig {
  optional int32 activityId = 1;
  optional string param = 2; // config key, e.g. GODISLAND_ITEM_ENERGY
  optional string value = 3;
  optional int32 topic = 4;
}

// MallTempMsg (protobuf/Mall, verbatim field numbers).
message ActivityMallTempMsg {
  optional int32 id = 1;
  optional string name = 2;
  optional int32 shopType = 3;
  optional string reward = 4;
  optional int32 category = 5;
  optional string price = 6;     // "costItemId=perUnit"; "0"/"X=0" = free
  optional string oldPrice = 7;
  optional int32 priceAdd = 8;
  optional bool isDouble = 9;
  optional int32 buyLimitType = 10;
  optional int32 buyLimit = 11;
  optional int32 sort = 12;
  optional string param = 13;    // "3|1800|0|0" first token 3 = ad-watch row
  optional int32 vipLimit = 14;
  optional string rechargeId = 15;
  optional string fundParam = 16;
}

message ActivityMallConfig {
  optional int32 activityId = 1;
  optional ActivityMallTempMsg mallTempMsg = 2;
  optional int32 buyUnlockType = 3;
  optional int32 buyUnlock = 4;
  optional string fundParam = 5;
  optional int32 topic = 6;
  optional int32 discount = 7;
}

message ActivityMallBuyCountData {
  optional int32 mallId = 1;
  optional int64 count = 2;
}

// 21005 ACTIVITY_BUY_MALL_GOODS (ActivityBase shape — the client's own
// builder sends {activityId, mallId, count, isUseADTime}, live-proven).
message ReqBuyActivityGoods {
  int32 activityId = 1;
  int32 mallId = 2;
  int64 count = 3;
  bool isUseADTime = 4;
  string extra = 5;
}
message ReqGetActivityConditionReward {
  optional int32 activityId = 1;
  optional int32 conditionId = 2;
}
message AcitivityConditionDataArr {
  optional int32 activityId = 1;
  optional int32 conditionId = 2;
}
message ReqGetActivityConditionRewardByArr {
  repeated AcitivityConditionDataArr activityDataList = 1;
}

message RspGetActivityConditionReward {
  optional int32 ret = 1;
  optional string rewards = 2;
}

// 21006 GET_RANK_REWARD — pure receive of the activity's season/bracket
// RANK settlement reward (client rank-reward view btnGetHandler sends
// {activityId, rankType}). Shape + answer hex 03ee LIVE-CONFIRMED
// 2026-11-08 (reborntrial_rank_live_test.go on 9063675): rankType 1 →
// ret=0 rewards "100152=2|100162=4|350016=1|105044=3", rankType 2 →
// ret=0 rewards "100025=15|100152=3|100004=60"; bogus types → ret=0 with
// EMPTY rewards (server no-op — same ±0 lesson as 217233).
message ReqGetRankReward {
  int32 activityId = 1;
  int32 rankType = 2;
}
message RspGetRankReward {
  optional int32 ret = 1;
  optional string rewards = 2; // "itemId=num|…" — empty = nothing to receive
}

message ReceiveCrossUnionRechargeRewardReq {
  optional int32 activityId = 1;
  optional int32 conditionId = 2;
}
message ReceiveCrossUnionRechargeRewardResp {
  optional int32 ret = 1;
  optional string rewards = 2;
}

message RspBuyActivityGoods {
  int32 ret = 1;
  optional string rewards = 2;
  optional string extra = 3;
}

message ActivityConditionConfig {
  // Milestone rows of the generic activity condition system (claim via
  // 21004, or 21045 for the cross-server union-recharge flavour).
  optional int32 activityId = 1;
  optional int32 conditionId = 2;
  optional string title = 3;
  optional string desc = 4;
  optional int32 type = 5;
  optional string rewards = 6;
  repeated string param = 8;
}

message ActivityCommonConfig {
  // The 21003 answer re-carries this activity's main-config entry, so the
  // hourly detail pull can also refresh the stored activity list rows.
  optional ActivityMainConfig mainConfig = 1;
  repeated ActivityConditionConfig conditionConfig = 2;
  repeated ActivityMallConfig mallConfig = 3;
  repeated ActivityParamConfig paramConfig = 4;
  // Rank-settlement table rows (raw field-walk 2026-11-08, live 9063675):
  // the 21006 rankType values are the entries' type field.
  repeated ActivityRankConfig rankConfig = 5;
}

// One row of the 21003 rank-settlement table. The engine only reads type
// (the 21006 sweep key — live 172: 1 = personal bracket "1|1|0|0"…
// "501|2000|0|0", 2 = guild bracket "1|1|0|0"…"36|48|0|0"); the rest are
// carried for honesty, unverified names.
message ActivityRankConfig {
  optional int32 id = 1;
  optional int32 cfgId = 2;
  optional string label3 = 3;
  optional string label4 = 4;
  optional int32 type = 5;
  optional string rewards = 6;
  optional string label7 = 7;
  optional string param = 8; // "min|max|0|0" rank bracket
}

message ActivityDetailConfig {
  optional ActivityCommonConfig commonConfig = 1;
  // Event-specific config, marshalled per activity type (Ball GVG:
  // BallGVGConfigSyncMsg place table — see ../remoteBallGVG).
  optional bytes uniqueConfig = 2;
}

message ActivityConditionData {
  optional int32 conditionId = 1;
  optional string value = 2;
  optional bool isGetReward = 3;
}

message ActivityCommonData {
  optional int32 activityId = 1;
  repeated ActivityConditionData conditionDataList = 2;
  repeated ActivityMallBuyCountData mallBuyCountList = 3;
  optional ActivityDetailConfig detailConfig = 4;
  // Player's own activity data, marshalled per activity type (Ball GVG:
  // BallGVGActivityDataTemp camp assignment — see ../remoteBallGVG).
  optional bytes playerData = 5;
}

message RspGetActivityDetail {
  int32 ret = 1;
  optional ActivityCommonData activity = 2;
}

message GodIslandGameMiniMapInfoReqMsg {
  int32 activityId = 1;
  optional int32 floor = 2;
  optional int32 group = 3;
}

// UnionBaseData is an external game type; we only read the owner union id
// (field 1) and the owner union name (field 4). Presence of baseData marks
// the city as owned.
message GodIslandUnionOwnerInfo {
  optional int64 unionId = 1;
  optional string unionName = 4;
}

// ── People on the map (kunlun-style display, owner 2026-10-19) ─────────────
// View-window pull ≡ kunlun 219903: request 206823 (000327e7) → answer
// 1aa7. The ONE answer carries both the people standing in the asked cities
// (cityInfo[].headInfo) and the units marching to/from them (routeInfo).
// Field numbers verbatim from remoteBlessFrog/GodIsland.decoded.proto.
message GodIslandGameCityInfoReqMsg {
  int32 activityId = 1;
  repeated int32 cityVec = 2;
  int32 floorId = 3;
  int32 groupId = 4;
}
message GodIslandGameCityInfoRespMsg {
  int32 ret = 1;
  repeated GodIslandGameCityInfo cityInfo = 2;
  repeated GodIslandGameRouteInfo routeInfo = 3;
  optional int32 floorId = 4;
  optional int32 groupId = 5;
}
message GodIslandGameCityInfo {
  int32 cityId = 1;
  optional bool haveFight = 2;
  optional GodIslandUnionSimpleInfo baseData = 3;
  repeated GodIslandPlayerHeadData headInfo = 4;
  optional int32 hp = 5;
  optional int32 curHp = 6;
  bool updateType = 7;
  optional bool destroyed = 8;
  optional string comment = 9;
}
message GodIslandUnionSimpleInfo {
  optional int64 unionId = 1;
  optional string unionName = 2;
  optional int64 serverId = 3;
}
// External game type (PlayerHeadDataMsg). Fields pinned from the live 1aa7
// capture of 2026-10-19 (36 head entries, activity 9062967): 1 = playerId
// (serverId*1e5+n), 2 = owner server/union id, 3 = ~14xxxx code (meaning
// TBD at port time), 4 = name (empty in the standing roster — march pushes
// carry the real name), 5 = headIcon (RouterAppearanceMsg.headIcon family).
message GodIslandPlayerHeadData {
  optional int64 playerId = 1;
  optional int64 refId = 2;
  optional int32 code3 = 3;
  optional string name = 4;
  optional int32 headIcon = 5;
}
// March-feed push ≡ kunlun 219943: incoming 1aa6 (206822).
message GodIslandGameRouteInfoSyncMsg {
  repeated GodIslandGameRouteInfo routeInfo = 2;
}
// City-roster change push: incoming 1abe (206846). Full GodIslandGameCityInfo
// rows for the cities whose standing roster changed — same shape as the 1aa7
// answer rows, no activityId (attribution = sole open variant). Shapes from
// GodIsland.decoded.proto.
message GodIslandGameCityChangeSyncMsg {
  repeated GodIslandGameCityInfo cityInfo = 1;
}
// City fight flag push: incoming 1ace (206862), observed 19x/4min resident.
message GodIslandCityBattleState {
  optional int32 cityId = 1;
  optional bool isBattle = 2;
}
message GodIslandGameCityBattleSyncMsg {
  repeated GodIslandCityBattleState cityStates = 1;
}
// Battle-line push (incoming 1ac0, 206848) — the islands' richest NAME
// source: standing headInfo carries no name, these do (shapes pinned from
// GodIsland.decoded.proto; GodIslandGameLinePlayerInfo.headInfo is the
// external PlayerHeadDataMsg = same wire shape as GodIslandPlayerHeadData).
message GodIslandGameLinePlayerInfo {
  optional string name = 1;
  optional string power = 2;
  optional int64 union = 3;
  optional GodIslandPlayerHeadData headInfo = 4;
  optional int64 playerId = 5;
}
