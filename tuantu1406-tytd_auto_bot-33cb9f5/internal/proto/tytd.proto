//protoc --proto_path=. --go_out=. tytd.proto
// ---------------------------------------------------------------------------
// Yard (vườn nhà) production chain — see ../remoteAll/YARD_PRODUCTION_CHAIN.md.
// Only the fields the bot reads or writes are declared; proto3 skips the rest
// of the official schema on the wire.
// ---------------------------------------------------------------------------

message YardSearchInfo {
  optional int32 areaId = 1;
  repeated int32 startPos = 2;
  repeated int32 endPos = 3;
}

// req of 215801 — the client sends an empty searchInfo list plus its own id.
message YardEnterReq {
  repeated YardSearchInfo searchInfo = 1;
  optional int64 targetPlayerId = 2;
}

message YardCellMsg {
  optional int64 uniqueId = 1; // instance identity used by make/gain — NOT buildId
  optional int32 buildId = 2;
  optional int32 row = 3;
  optional int32 col = 4;
  optional int32 turn = 5;
  optional int32 status = 6;
}

// Runtime detail of one building instance. status: 0 idle, 1 making, 2
// upgrading; a finished-but-uncollected run is still busy (client "Make_end").
message YardBuildDetailMsg {
  optional int32 level = 1;
  optional int32 status = 2;
  optional int32 productId = 3;
  optional int64 startTime = 4;
  optional int64 endTime = 5;
  optional int32 collectNum = 6;
  optional int64 levelUpEndTime = 7;
  optional int64 totalNum = 8;
  optional int32 speedTimes = 9;
  optional bool isUnionHelp = 10;
}

message YardBuildingMsg {
  optional YardCellMsg yardCellMsg = 1;
  optional YardBuildDetailMsg yardBuildDetailMsg = 2;
}

message YardAreaInfoMsg {
  optional int32 areaId = 1;
  optional int32 areaStatus = 2;
  repeated YardBuildingMsg buildingMsg = 3;
}

// resp of 215801 (incoming type 3db9) — yard snapshot, keyed per uniqueId.
message YardEnterResp {
  int32 ret = 1;
  repeated YardAreaInfoMsg areaInfo = 2;
  optional YardDrawDataMsg drawData = 8; // today's draw counters ride the snapshot
}

// req of 215825. isCancel=true cancels the run (rewards may return); the bot
// only ever starts. productId/num follow the last recipe the server showed.
message YardBuildMakeReq {
  optional int64 uniqueId = 1;
  optional int32 buildId = 2;
  optional int32 productId = 3;
  optional int32 num = 4;
  optional bool isCancel = 5;
}

message YardBuildMakeResp {
  int32 ret = 1;
  optional string rewards = 2;
}

// req of 215827 — no productId/num: the server decides the collectable output.
message YardBuildGainRewardReq {
  int64 uniqueId = 1;
  int32 buildId = 2;
}

message YardBuildGainRewardResp {
  int32 ret = 1;
  optional string rewards = 2;
  optional string extraRewards = 3;
  optional string inspireReward = 4;
}

// push 215848 — replaces one instance's detail wholesale (zeros are real
// clears); the bot re-reads state via ENTER instead of tracking these.
message YardBuildInfoMsgSync {
  optional int64 uniqueId = 1;
  optional int64 buildId = 2;
  optional YardBuildDetailMsg yardBuildDetailMsg = 3;
}

// Yard draw (quay thưởng vườn nhà) — req 215822 / resp 3dce, push 3dea.
// YardDrawDataMsg.freeDrawTimes and .adCount are TODAY'S USED counts
// (ICT-day reset; the server pushes YardRefreshDataSync on rollover), capped
// server-side by YARD_BUILD_DRAW_FREE_TIMES / YARD_BUILD_DRAW_AD_TIMES
// (1 and 2 in GameConfig 4.9230). isUseADTime is only set when the client
// pays the SuoShiXiang item to skip actually watching the ad — never here.
// isTen is proto2-required, so it must be on the wire even when false.
message YardDrawDataMsg {
  optional int32 freeDrawTimes = 1; // free draws already used today
  optional int32 drawCount = 2;     // pity progress
  optional int32 ensureCount = 3;   // pity tier index
  optional int32 adCount = 4;       // ad draws already used today
}

message YardDrawReq {
  optional bool isTen = 1;    // multi (base-times) draw flag
  optional bool isUseADTime = 2;
  optional bool isADType = 3; // this draw consumes one ad slot
  optional int32 poolId = 4;  // 0 = default pool (what the client sends)
  optional int32 times = 5;   // omitted for a single draw
}

message YardDrawResult {
  optional string rewards = 1;
  optional string items = 2;
  optional bool inNew = 3;
  optional bool isTransPiece = 4;
}

message YardDrawResp {
  int32 ret = 1;
  repeated YardDrawResult drawResult = 2;
  optional YardDrawDataMsg drawData = 3; // fresh counters after the draw
  optional bool pieceShopOpen = 4;
  optional bool isUseADTime = 5;
}

// push 215850 — daily draw/speed counters re-synced (day rollover).
message YardRefreshDataSync {
  optional YardDrawDataMsg drawData = 1;
  optional int32 speedTimes = 2;
}

