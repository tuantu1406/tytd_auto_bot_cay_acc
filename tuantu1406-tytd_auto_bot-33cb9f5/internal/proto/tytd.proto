// ── Union daily activity boxes (nhiệm vụ sôi nổi bang) ──────────────────
// 22117 S_UNION_DAILYTASK (incoming 0845): panel snapshot — progress is the
// union-activity vitality earned today, taskList the milestone indices
// already claimed. Targets are client config UNION_DAILY_PARAM
// "150|250|500|750|1000". Schema: ../remoteAll/Union.decoded.proto.
message ReqUnionDailyTask {}

message RspUnionDailyTask {
  optional int32 ret = 1;
  optional int32 progress = 2;
  repeated int32 taskList = 3;
}

// 22118 S_UNION_GETDAILYTASK (incoming 0846): claim milestone actIndex (0-4).
message ReqUnionGetDailyTask {
  optional int32 actIndex = 1;
}

message RspUnionGetDailyTask {
  optional int32 ret = 1;
  optional string reward = 2;
}

// ---------------------------------------------------------------------------
// Ball GVG (Thượng Cổ Di Tích) event — schemas from
// ../remoteBallGVG/BALL_GVG_PROTOCOL.md + BallGVG.decoded.proto. Only the
// fields we consume are declared; proto3 skips the rest as unknown.
//
// WIRE NOTE: unlike Holy Land, EVERY Ball GVG message echoes the live
// activityId, so responses attribute directly — no FIFO queue. activityId is
// server-issued and never 0, so plain (non-optional) fields are safe here.
// HP/fightValue/damage travel as decimal STRINGS (values may exceed int64
// display precision downstream — keep them strings). The 21110 LEAVE_ACT
// registry entry has no encoder: the stock client sends an EMPTY body there,
// so we hand-write that frame rather than marshalling the (inactive) proto.
// ---------------------------------------------------------------------------

// Subset of the external PlayerCharacterImageMsg chain used only to recover
// a player's name from the bytes we consume (playerBaseDataMsg.field 3).
message BallGVGPlayerBase {
  optional int64 playerId = 1;
  optional string nickName = 3;
  optional string fightValue = 5;
}
message BallGVGPlayerImage {
  optional BallGVGPlayerBase playerBaseDataMsg = 1;
}

message BallGVGUserPropertyTemp {
  optional string totalHp = 1;
  optional string hp = 2;
  optional string fightValue = 3;
  optional int32 realmsId = 4;
  optional int32 attackSpeed = 5; // ms between attacks
}

message BallGVGPositionTemp {
  string x = 1;    // UI coordinate, decimal string with 5 fraction digits
  string y = 2;
  string dirX = 3;
  string dirY = 4;
  int64 time = 5;  // ms stamp of the report
}

message BallGVGUserDataTemp {
  int32 activityId = 1;
  optional BallGVGUserPropertyTemp property = 2;
  optional int32 campId = 3;
  optional int32 placeId = 4;
  optional int64 transferTime = 5;
  optional int64 attackTime = 6;  // last attack ms; + attackSpeed = next ok
  optional int64 reviveTime = 7;  // absolute ms; dead while > now
}

// One occupant of a room: who they are, their camp/HP, where they stand.
message BallGVGOtherUserTemp {
  optional int32 campId = 1;
  optional BallGVGPlayerImage playerData = 2;
  optional BallGVGUserPropertyTemp property = 3;
  optional int32 placeId = 4;
  optional BallGVGPositionTemp position = 5;
  optional int64 reviveTime = 6;
}

message BallGVGCampTemp {
  int32 campId = 1;
  optional int32 majorPlaceId = 4; // HQ the camp leader marked
}

message BallGVGPlaceDataTemp {
  optional int32 placeId = 1;
  repeated BallGVGOtherUserTemp user = 2;
  optional int64 seizeTime = 3;
  optional int32 campId = 4; // owner camp of the place
}

message BallGVGCampScoreTemp {
  optional int32 campId = 1;
  optional int64 score = 2;
  optional int32 rank = 3;
  optional int64 totalScore = 4;
  optional int32 totalRank = 5;
}

message BallGVGCampScoreSyncTemp {
  optional int32 campId = 1;
  optional int64 score = 2;
}

// One room from the activity config (uniqueConfig of 21003's detailConfig).
message BallGVGPlaceConfigTemp {
  int32 activityId = 1;
  optional int32 id = 2;
  optional int32 type = 3; // 4 = capturable battlefield, <4 = fixed camps
  optional string name = 4;
  optional int32 level = 5;
  optional int32 radius = 6;
  optional int32 seizeScore = 7;
  optional int32 seizeProduce = 8;
}

message BallGVGConfigSyncMsg {
  repeated BallGVGPlaceConfigTemp placeConfig = 1;
}

// playerData bytes of our own activity record (21003): camp assignment.
message BallGVGActivityDataTemp {
  int32 activityId = 1;
  optional int32 campId = 2;
  optional int32 state = 3;
  optional int32 endNum = 4;
  optional int32 position = 5;
}

// 21103 — full snapshot; also the reconnect-recovery spine.
message BallGVGEnterActivityReqMsg { int32 activityId = 1; }
message BallGVGEnterActivityRespMsg {
  optional int32 ret = 1;
  optional BallGVGUserDataTemp userData = 2;
  optional BallGVGCampTemp camp = 3;
  optional BallGVGPlaceDataTemp placeData = 4; // current room roster
  repeated BallGVGCampScoreSyncTemp score = 5;
  optional int32 minLv = 7;
  optional int32 maxLv = 8;
}

// 21104 enter / teleport between places (home = placeId of our camp).
message BallGVGEnterPlaceReqMsg {
  int32 activityId = 1;
  int32 placeId = 2;
}
message BallGVGEnterPlaceRespMsg {
  optional int32 ret = 1;
  optional BallGVGPlaceDataTemp placeData = 2;
  optional int32 placeId = 3;
  optional int64 transferTime = 4;
}

// 21105 leave the current room (back to the activity lobby).
message BallGVGLeavePlaceReqMsg { int32 activityId = 1; }
message BallGVGLeavePlaceRespMsg { optional int32 ret = 1; }

// 21106 position report — cosmetic state for other clients, no server-side
// movement simulation.
message BallGVGMoveReqMsg {
  int32 activityId = 1;
  BallGVGPositionTemp position = 2;
}
message BallGVGMoveRespMsg { optional int32 ret = 1; }

// 21107 attack the named in-room player. Server computes the exchange.
message BallGVGAttackReqMsg {
  int32 activityId = 1;
  int64 attackPlayerId = 2;
}
message BallGVGAttackRespMsg {
  optional int32 ret = 1;
  optional int64 attackTime = 2;
  optional BallGVGAttackedTemp attack = 3;
  optional int64 attackScore = 4;
  optional BallGVGUserDataTemp userData = 5;
  optional BallGVGBattleScoreResultTemp scoreResult = 6; // ours (death summary)
}

// 21109 mark a rally point for the camp (leader role is server-checked).
message BallGVGMarkPlaceReqMsg {
  int32 activityId = 1;
  int32 placeId = 2;
}
message BallGVGMarkPlaceRespMsg { optional int32 ret = 1; }

// 21111 whole-place summary (ownership + per-camp head counts).
message BallGVGGetPlaceInfoReqMsg { int32 activityId = 1; }
message BallGVGPlaceCampMemberTemp {
  optional int32 campId = 1;
  optional int32 num = 2;
}
message BallGVGPlaceSimpleTemp {
  optional int32 placeId = 1;
  optional int32 seizeCampId = 2; // current capturer (0 = none contested)
  repeated BallGVGPlaceCampMemberTemp campMember = 3;
}
message BallGVGGetPlaceInfoRespMsg {
  optional int32 ret = 1;
  repeated BallGVGPlaceSimpleTemp place = 2;
}

// One resolved exchange between two players (ours in the attack response,
// others' in the 21116 push).
message BallGVGOneAttackedTemp {
  optional string damage = 1;
  optional bool isDodge = 3;
  optional bool isCrit = 4;
}
message BallGVGAttackedTemp {
  optional int64 attackPlayerId = 1;
  optional int64 attackedPlayerId = 2;
  optional string attackHp = 4;  // attacker HP after the exchange
  optional string attackedHp = 5; // target HP after (0 = killed)
  repeated BallGVGOneAttackedTemp atkTempList = 6;
}

message BallGVGBattleScoreTemp {
  optional int32 kill = 1;
  optional int64 killScore = 2;
  optional int32 seize = 3;
  optional int64 seizeScore = 4;
}
message BallGVGBattleScoreResultTemp {
  optional BallGVGBattleScoreTemp battleScore = 1; // this fight
  optional BallGVGBattleScoreTemp TotalBattleScore = 2; // round totals
}

// ---- server pushes ----------------------------------------------------

// 21116: other occupants fighting each other (room battle chatter).
message BallGVGAttackedSyncMsg {
  repeated BallGVGAttackedTemp attack = 1;
}

// 21117: REPLACE the camp scoreboard with this list.
message BallGVGCampScoreSyncMsg {
  repeated BallGVGCampScoreSyncTemp campScore = 1;
}

// 21118: periodic position batch of room occupants.
message BallGVGSimpleUserTemp {
  optional int64 playerId = 1;
  optional BallGVGPositionTemp position = 2;
}
message BallGVGPlaceSyncMsg {
  repeated BallGVGSimpleUserTemp user = 1;
}

// 21120: REPLACE our camp metadata (rally mark etc.).
message BallGVGCampSyncMsg {
  optional BallGVGCampTemp camp = 1;
}

// 21121: WE were attacked — authoritative; userData must REPLACE ours.
message BallGVGAttackedUserSyncMsg {
  optional BallGVGOtherUserTemp attackUserData = 1; // the attacker
  optional BallGVGAttackedTemp attack = 2;
  optional int64 attackTime = 3;
  optional BallGVGUserDataTemp userData = 4;
  optional BallGVGBattleScoreResultTemp scoreResult = 5; // ours after the hit
}

// 21122: capture progress/flip on one place. campId = current owner.
message BallGVGPlaceSeizeInfoTemp {
  optional int32 campId = 1;
  optional int32 seizeTime = 2;
  optional int32 num = 3;
}
message BallGVGPlaceSeizeSyncMsg {
  optional int32 placeId = 1;
  repeated BallGVGPlaceSeizeInfoTemp seize = 2;
  optional int64 beginTime = 3;
  optional int32 seizeCampId = 4; // camp currently capturing
  optional int64 seizeTime = 5;
  optional int32 campId = 6;      // camp that OWNS the place
}

// 21123 / 21124: room roster deltas.
message BallGVGEnterPlaceSync {
  optional BallGVGOtherUserTemp user = 1;
}
message BallGVGLeavePlaceSync {
  optional int64 playerId = 1;
  optional int32 type = 2; // 1 = removed (death), 2 = died in place, else left
}

// 21127: round settlement (final scores + our rank). bestPerformance and
// campBestPerformance (fields 3/4) carry PlayerCharacterImage payloads we
// never render — left unknown on purpose.
message BallGVGEndDataTemp {
  optional BallGVGBattleScoreTemp battleScore = 1; // ours, this round
  repeated BallGVGCampScoreTemp campScore = 2;
  optional int64 score = 5;
  optional int32 rank = 6;
}
message BallGVGEndDataSyncMsg {
  optional BallGVGEndDataTemp endData = 1;
}

// ── Sky Trade (Tiên Vực Thương Đồ / 仙域商途) ──────────────────────────────
// Activity system type 150; the live activityId comes from the activity list
// and is echoed in every message (the type is never sent as an id). Two
// flows: the trade-intelligence report (215000 → 215001 → 215024) and the
// auto-trader loop (215001 snapshot → 215005 deals → 215004 move →
// 215009 arrival). Field numbers per
// ../remoteSkyTrade/SkyTrade.decoded.proto. The enter-map snapshot is
// fully modelled — the web map renders ships and port markets from it.

// The auto-trader (see player_skytrade.go) then plays the client's own
// loop on top: 215005 deal (buy AND sell), 215004 move, 215009 claim
// arrival — plus the ENTER_MAP snapshot's pending arrival event.

// 215000 / 215001 / 215009 / 215024 requests all share {activityId}.
message SkyTradeActivityReq {
  optional int32 activityId = 1;
}

// 215000: only ret is read (0 = session open, current port server-derived).
message SkyTradeEnterActivityResp {
  optional int32 ret = 1;
}

// 215001: the full map snapshot — own ship, every alliance ship, and the
// port markets (field tags per ../remoteSkyTrade/SkyTrade.decoded.proto).
// event(6) is a pending unclaimed arrival; the auto-trader claims it via
// 215009 before touching the market.
message SkyTradeEnterResp {
  optional int32 ret = 1;
  optional SkyTradePlayerData playerData = 2;
  repeated SkyTradeUnionPlayerData unionPlayerData = 3;
  repeated SkyTradePortGoodsInfo portGoods = 4;
  optional SkyTradeArrivalEvent event = 6;
}

// 215009 answer: the authoritative arrival (eventType != 0) + fame deltas.
message SkyTradeGetRewardResp {
  optional int32 ret = 1;
  optional SkyTradeArrivalEvent event = 2;
  optional int32 finalFame = 3;
  optional int32 totalFame = 4;
}

// Arrival record shared by ENTER_MAP.event and GET_REWARD.event.
message SkyTradeArrivalEvent {
  optional int32 sourcePort = 1;
  optional int32 targetPort = 2;
  optional int32 eventType = 3;
  optional string rewards = 4;
  optional int32 addFame = 5;
}

message SkyTradePlayerData {
  optional SkyTradeAirshipInfo airshipInfo = 1;
  optional int64 availableFunds = 2;
  repeated SkyTradeGoods goods = 3;
}

// funds(4) is the cargo-hold value cap (server-enforced on buy).
message SkyTradeAirshipInfo {
  optional int32 sourcePort = 1;
  optional int32 targetPort = 2;
  optional int64 startTime = 3;
  optional int64 funds = 4;
  optional int32 speeds = 5;
  optional int32 level = 6;
}

message SkyTradeUnionPlayerData {
  optional SkyTradePlayerBase player = 1;
  optional SkyTradeAirshipInfo airshipInfo = 2;
}

// PlayerBaseDataMsg subset — name + union name are all the map labels.
message SkyTradePlayerBase {
  optional int64 playerId = 1;
  optional string nickName = 3;
  optional SkyTradeUnionBase unionData = 6;
}

message SkyTradeUnionBase {
  optional int64 unionId = 1;
  optional string name = 4;
}

message SkyTradePortGoodsInfo {
  optional int32 portId = 1;
  optional int32 rareGoodsId = 2;
  repeated SkyTradeGoods goods = 3;
}

message SkyTradeGoods {
  optional int32 goodsId = 1;
  optional int64 num = 2;
  optional int64 price = 3;
}

// Activity-detail uniqueConfig (21003): the event's static tables. Only the
// fields the caravan reads are declared; unknown fields are skipped on the
// wire. goodsConfig.price is the BASE price every market listing is compared
// against; portConfig.specialGoodId is each port's own produce.
message SkyTradeGoodsConfig {
  optional int32 goodsId = 1;
  optional string icon = 2;
  optional int32 price = 3;
  optional int32 num = 4;
}

message SkyTradePortConfig {
  optional int32 portId = 1;
  optional int32 specialGoodId = 2;
}

message SkyTradeConfigSync {
  optional int32 activityId = 1;
  repeated SkyTradeGoodsConfig goodsConfig = 2;
  repeated SkyTradePortConfig portConfig = 4;
}

// 215024: ret plus, on success, which port's rare goods were published.
message SkyTradeReportGoodsResp {
  optional int32 ret = 1;
  optional int32 rareGoodsId = 2;
  optional int32 portId = 3;
}

// 215004: sail the idle ship to a wire port (10001..10015).
message SkyTradeGotoPortReq {
  optional int32 activityId = 1;
  optional int32 port = 2;
}

message SkyTradeGotoPortResp {
  optional int32 ret = 1;
  optional SkyTradeAirshipInfo airshipInfo = 2;
}

// 215003: consume num acceleration items off the current voyage. On success
// airshipInfo(2) carries the updated speeds counter (arrival shrinks by
// speeds × RUNBUSINESS_ACCELATE_ITEM_EFFECT); when the last item docks the
// ship, event(3) is the completed arrival and 215009 is not needed.
message SkyTradeAddSpeedReq {
  optional int32 activityId = 1;
  optional int32 num = 2;
}

message SkyTradeAddSpeedResp {
  optional int32 ret = 1;
  optional SkyTradeAirshipInfo airshipInfo = 2;
  optional SkyTradeArrivalEvent event = 3;
}

// 215005: the ONE deal endpoint — type packs the client's 64-bit quantity:
// type = (qty>>32)<<2 + mode, mode 3 = buy, 0 = sell; num = low 32 bits.
// On success goods(2) is the complete updated cargo hold, availableFunds the
// new cash, goodsNum the new market stock for that good.
message SkyTradeDealReq {
  optional int32 activityId = 1;
  optional int32 port = 2;
  optional int32 goodsId = 3;
  optional int32 num = 4;
  optional int32 type = 5;
}

message SkyTradeDealResp {
  optional int32 ret = 1;
  repeated SkyTradeGoods goods = 2;
  optional int64 availableFunds = 3;
  optional int64 goodsNum = 4;
  optional int32 level = 5;
}

// S_ELIXIR_GET_TIME_WATER (235536): nhận suất nước miễn phí của linh điền.
// Body chuẩn client bắt được: {var1=0, var2=số suất} — sáng gửi 08 00 10 01,
// chiều gửi 08 00 10 02; hai suất/ngày
// (11:00–14:00 và 17:00–21:00 giờ VN) chỉ khác nhau ở thời điểm gửi.
message ElixirGetTimeWaterReq {
  optional int32 var1 = 1;
  optional int32 var2 = 2;
}

// ---- Big Chess (Tiên Dịch Bài Cục / 仙弈破阵, activity type 341) ----
// Schema from ../remoteBigChess/BigChess.decoded.proto + BIG_CHESS_PROTOCOL.md.
// Request IDs 234101..234106 (ranked) and 234121..234123 (practice); the
// shared network layer sends full IDs, answers arrive with id % 100000 →
// transport 34101..34106 (hex 8535..853A) / 34121..34123 (8549..854B).
// The bot carries this game for the AI-play MCP tools only — ranked mode;
// the server is authoritative for legality, so only consumed fields are
// declared and everything else rides past as unknown.
message ChessData {
  optional int32 chessNo = 1; // unique piece instance — the board key
  optional int32 chessId = 2; // piece type: 1001 pawn 1002 advisor 1003 elephant 1004 cannon 1005 knight 1006 rook 1007 general 1008 REDJU (the player)
  optional int32 x = 3;       // zero-based column
  optional int32 y = 4;       // zero-based row
}

message ChineseChessPlayerDataSync {
  optional int32 freeCount = 1;  // remaining free ranked starts today
  optional int32 maxScore = 2;   // best historical score
  optional int32 gameStatus = 3; // server run status 0..3
}

// uniqueConfig of the 21003 activity detail (repeated per enemy type).
message ChessConfig {
  optional int32 id = 1;
  optional int32 score = 2;
  optional string canGo = 3;     // carried verbatim; client never consults it
  optional string moveLimit = 4; // ditto
}

message ChineseChessActivityConfig {
  repeated ChessConfig chessConfigList = 1;
}

message ChineseChessEnterReq {
  int32 activityId = 1;
}
message ChineseChessEnterResp { // 234101 → incoming 8535
  int32 ret = 1;
  optional ChineseChessPlayerDataSync playerData = 2;
}

message ChineseChessEnterGameReq {
  int32 activityId = 1;
}
message ChineseChessEnterGameResp { // 234102 → incoming 8536; start OR resume
  int32 ret = 1;
  repeated ChessData chessDataList = 2; // full enemy board
  optional ChessData selfChessData = 3;
  optional int32 itemReviveCount = 4;    // CONSUMED counts, not remaining
  optional int32 ingotReviveCount = 5;
  optional int32 passReviveCount = 6;
  optional bool guideOpen = 7;
  optional int32 nextRound = 8;          // spawn-wave countdown of nextChess
  repeated ChessData nextChess = 9;      // the whole next wave
  optional int32 gameStatus = 10;        // 0 running 1 revive 2 over 3 pass
  optional int64 score = 11;             // authoritative, keep int64
  optional int32 powerTimes = 12;        // active cross charges
  optional int32 round = 13;             // current step counter
  optional int32 powerOnCount = 14;
  optional int32 powerCrossCount = 15;
  optional int32 powerRemoveTypeCount = 16;
  optional int32 powerRemoveRandomCount = 17;
  optional int32 freeCount = 18;
}

message ChineseChessMoveReq { // all three power bools are REQUIRED on the wire
  int32 activityId = 1;
  int32 x = 2;
  int32 y = 3;
  bool powerOn = 4;          // pipe: glide through blockers, clear crossed segment
  bool powerCross = 5;       // consume a cross charge, clear dest row+column
  bool powerRemoveType = 6;  // same-type removal onto the target's chessId
}
message ChineseChessMoveResp { // 234103 → incoming 8537
  int32 ret = 1;
  repeated ChessData chess = 2;    // survivor board set — REPLACE by chessNo
  optional ChessData selfChess = 3;
  optional ChessData moveChess = 4; // enemy the server moved this turn
  optional int32 nextTurn = 5;
  repeated ChessData nextChess = 6; // replaces the spawn preview
  optional int32 gameStatus = 7;
  optional int32 isRevive = 8;      // >0: automatic pass/shield revive happened
  optional int64 score = 9;
  optional int32 step = 10;
  optional int32 powerOnCount = 11;
  optional int32 powerCrossCount = 12;
  optional bool newPlayer = 13;     // beginner-protection recovery fired
  optional int32 passReviveCount = 14;
  optional int32 powerRemoveTypeCount = 15;
}

message ChineseChessEndReq {
  int32 activityId = 1;
}
message ChineseChessEndResp { // 234104 → incoming 8538
  int32 ret = 1;
  optional int64 score = 2;
  optional int32 lastRank = 3;
  optional int32 nowRank = 4;
}

message ChineseChessUseItemReq {
  int32 activityId = 1;
  int32 type = 2; // 0 = revive (server picks the cost from run state), 1 = unlock danger guide
}
message ChineseChessUseItemResp { // 234105 → incoming 8539
  int32 ret = 1;
  repeated ChessData chess = 2; // survivor board after revive — REPLACE
  optional int32 itemReviveCount = 3;
  optional int32 ingotReviveCount = 4;
  optional bool guideOpen = 5;
}

message ChineseChessUseRemoveItemReq {
  int32 activityId = 1;
}
message ChineseChessUseRemoveItemResp { // 234106 → incoming 853A
  int32 ret = 1;
  repeated ChessData chess = 2; // the REMOVED pieces — not a board replace
  optional int32 powerRemoveRandomCount = 16;
}

// ---- Big Chess practice trio (234121-234123 → 8549-854B) -----------------
// Practice mirrors ranked field-for-field EXCEPT: enter-game resp reuses the
// ranked shape exactly; move resp has no power counters and its newPlayer
// sits at 11 (ranked uses 11 for powerOnCount); end resp carries the
// survivor board and scores at 3/4/5 (ranked: score at 2).

message ChineseChessPracticeMoveResp { // 234122 → incoming 854A
  int32 ret = 1;
  repeated ChessData chess = 2;     // survivor board — REPLACE
  optional ChessData selfChess = 3;
  optional ChessData moveChess = 4; // enemy the server moved this turn
  optional int32 nextTurn = 5;
  repeated ChessData nextChess = 6;
  optional int32 gameStatus = 7;
  optional int32 isRevive = 8;
  optional int64 score = 9;
  optional int32 step = 10;
  optional bool newPlayer = 11;
}

message ChineseChessPracticeEndResp { // 234123 → incoming 854B
  int32 ret = 1;
  repeated ChessData chess = 2; // survivor board at settle
  optional int64 score = 3;
  optional int32 lastRank = 4;
  optional int32 nowRank = 5;
}

// ---- Treasure Auction (Tàng Bảo Các, 234xxx) ------------------------------

message TreasureAuctionHelpReq { // 234007 (00 03 92 17) → incoming 84D7
  // Single-field body the client sends to help a treasure dig; the bot
  // always sends 1. Refusals (e.g. nothing to help) come back on 84D7 and
  // are not read.
  int32 type = 1;
}

// ---- Pupil (Đồ Đệ, 2118xx) -------------------------------------------------

message PupilTrainReq { // 211802 (00 03 3B 5A) → incoming 2E1A
  // index = seat (site) index of the pupil, the same key the server uses in
  // CurrentTrainTimeInfoMsg {index, trainTimes, remainTrainTimes, ...};
  // per-seat attempts recover on PUPIL_ENERGY_RECOVER_TIME. index=0 means
  // train ALL seats — `optional` so the 0 is actually emitted (08 00)
  // instead of being dropped by proto3's implicit-zero rule.
  optional int32 index = 1;
}

// ---- Chaos Law (Pháp Tắc Thái Hư, 2367xx) ---------------------------------
// Requests: ENTER/PERCEIVE/ONE_KEY_HELP carry an empty body; EVOLVE and
// EVOLVE_REWARD carry only {id} (law id from the player's unformed list).
// All shapes verified live 2026-10-02 (wire dump in player_chaoslaw_live_test.go).

message ChaosLawIdReq { // 236703 + 236704 request
  optional int32 id = 1; // unformed-law id from ChaosLawPlayerData.laws
}

message ChaosLawUnformed { // playerData.f6 — one evolve slot
  optional int32 id = 1;
  optional int32 num = 2;
  optional int32 v3 = 3;
  optional int64 v4 = 4;
  optional int32 evolving = 5; // 1 = timer armed/running
  optional int64 v6 = 6;
  optional int64 endTime = 7;  // ms; <=now && evolving → finished, claimable
  optional int32 v8 = 8;
}

message ChaosLawSeparationEquip {
  optional int32 slot = 1;
  repeated int32 lawIds = 2;
}

message ChaosLawPlayerData {
  optional int32 v1 = 1;
  optional int64 perceiveNextAccumulateTime = 2; // ms of next +1 energy
  optional int32 helpCount = 3;
  optional int32 v4 = 4;
  optional int32 perceiveCount = 5; // client perceives while >= 5
  repeated ChaosLawUnformed laws = 6;
  optional int32 wareHouseLimit = 7;
  repeated int32 equippedLawIds = 8;
  optional int32 sellCount = 9;
  repeated ChaosLawSeparationEquip separationEquips = 10;
  optional int32 v11 = 11;
}

message ChaosLawEnterResp { // 236701 → 8F5D
  optional int32 ret = 1;
  optional ChaosLawPlayerData playerData = 2;
  // 3: item list, 4: redPoint — ignored
}

message ChaosLawPerceiveResp { // 236702 → 8F5E
  // f1 is a monotonic server counter (live: 0, 36702), NOT a ret code.
  optional int32 v1 = 1;
  optional int32 v4 = 4;
  optional int32 v5 = 5;
  optional ChaosLawPlayerData playerData = 6;
  // 7: newItems — ignored
}

message ChaosLawEvolveResp { // 236703 → 8F5F
  optional int32 v1 = 1; // answer scalar (server accepted); no ret field seen
}

message ChaosLawEvolveRewardResp { // 236704 → 8F60
  optional int32 ret = 1;
  // 2: claimed item, 3: playerData (fresher copy), 4: rewards string — 2/4
  // ignored; 3 is parsed.
  optional ChaosLawPlayerData playerData = 3;
}

message ChaosLawOneKeyHelpResp { // 236712 → 8F68
  optional int32 helpCount = 1; // no ret field seen; any answer = accepted
}

// ---- Yue Bao (Tiên Ngọc Bảo Phủ, activity type 170, 2170xx) ---------------
// Live-verified 2026-10-02: ENTER/INTERACTE body {activityId}; DEPOSIT body
// {activityId, slot, amount}. ENTER answers with the whole history: records
// {ts ms, kind, amount, flag} where kind 1 = an OPEN deposit, 2/3 =
// collected/withdrawn. Slot 1 = 1 day, slot 3 = 3 days (pending sync 426c
// head {maturity, slot, amount} proved it). INTERACTE collects everything
// due (no slot param); a per-slot INTERACTE body is refused (17003).

message YueBaoActivityReq { // ENTER 217001 + INTERACTE 217003 request
  optional int32 activityId = 1;
}

message YueBaoDepositReq { // DEPOSIT 217002 request
  optional int32 activityId = 1;
  optional int32 slot = 2;
  optional int32 amount = 3;
}

message YueBaoRecord {
  optional int64 ts = 1;    // ms
  optional int32 kind = 2;  // 1 = open deposit, 2/3 = collected/withdrawn
  optional int32 amount = 3;
  optional int32 flag = 4;
}

message YueBaoEnterData { // the f2 wrapper inside ENTER resp
  repeated YueBaoRecord records = 4;
}

message YueBaoEnterResp { // 217001 → 4269
  optional int32 ret = 1;
  optional YueBaoEnterData data = 2;
}

message YueBaoDepositResp { // 217002 → 426a
  optional int32 ret = 1;
}

message YueBaoInteracteResp { // 217003 → 426b; f2 reward string ignored
  optional int32 ret = 1;
}

// ---- Talent / Huyết Mạch (2062x) -------------------------------------------
// Requests are full 20xxx ids; answers arrive at id-20000 (like SPIRIT_DRAW
// 20822 → 0336). Field numbers live-verified 2026-10-02
// (player_huyetmach_live_test.go): roll refusal 1201 = missing item 100007
// (TALENT_PULL_COST); the DEAL body {3:{index,action=1=delete},4:0} is the
// real client's captured frame and answered ret=0.

message TalentRandomReq { // 20622 request
  optional int32 randomTimes = 1; // 1..5, cap by talentCreateLevel (AUTOTALENT_COST_RATE)
}

message TalentRandomResp { // 20622 → 026e; unDealTalentData (f2) ignored — re-read via GET_UNDEAL
  optional int32 ret = 1;
}

message TalentDealItem {
  optional int32 index = 1;  // position in the un-dealt queue
  optional int32 action = 2; // 1 = DELETE (live-captured)
}

message TalentDealReq { // 20623 request
  optional TalentDealItem item = 3;
  optional int32 mode = 4; // client capture: 0
}

message TalentDealResp { // 20623 → 026f; f2 reward + f3 player data ignored
  optional int32 ret = 1;
}

message TalentUndealData {
  // f2 repeated = one entry per pending result; contents (talentId, quality,
  // attrs) unused while the policy is delete-all.
  repeated bytes items = 2;
}

message TalentUndealResp { // 20625 → 0271
  optional int32 ret = 1;
  optional TalentUndealData data = 2;
}

message TalentPlayerDataMsg { // 026d login sync {1:talentData×12, 2=47, 3=651, 5=4870}
  // f2 is read as talentCreateLevel: it alone fits the AUTOTALENT_COST_RATE
  // 1..60 gate range (47 → roll x3). f3/f5 are book counters, far outside
  // any level range. If a future build moves the field, a wrong multiplier
  // just yields roll refusals (ret≠0, nothing spent) — self-limiting.
  optional int32 talentCreateLevel = 2;
}

// ---- ComposeBall / "đại hội luyện khí" (activity type 130) -----------------
// Recovered from the CDN text asset protobuf/ComposeBall (package
// com.yq.msg.CityMsg; cc.TextAsset payload de-obfuscated by stripping the
// "12345" prefix and XOR-ing every char with 1). Client required fields are
// relaxed to optional per this file's proto3 convention — wire-compatible.
// Requests 213001..213005 → transport 32c9..32cd (%100000).

message ComposeBallConfig {
  optional int32 id = 1;        // config id the balls carry (configId)
  optional int32 level = 2;     // merge level 1..FRUIT_MAX_LEVEL+1
  optional string icon = 3;
  optional int32 width = 4;     // ball diameter (client px)
  optional int32 score = 5;     // points awarded when this level is formed
  optional int32 currency = 6;
  optional string destroyed = 7; // per-itemType level gates ("|" list)
}

message ComposeBallItemUseData {
  optional int32 itemId = 1;
  optional int32 num = 2;
}

message ComposeBallConfigSync { // activity-detail uniqueConfig
  repeated ComposeBallConfig configs = 1;
}

message ComposeBallUserDataSync {
  optional int32 hp = 1;          // remaining drops (stamina)
  optional int64 hpTime = 2;      // last regen anchor
  optional int32 costHp = 3;      // hp cost per drop
  repeated ComposeBallItemUseData itemUseData = 4;
  optional int32 score = 5;
  optional int32 maxScore = 6;
}

message ComposeBallBallData {
  optional int32 id = 1;
  optional int32 configId = 2;
  repeated string position = 3;        // [x,y] fixed(5) strings
  repeated string linearVelocity = 4;  // [x,y] fixed(5) strings
  optional string scale = 5;           // fixed(5)
}

message ComposeBallEnterGameReq { // 213001
  optional int32 activityId = 1;
}

message ComposeBallEnterGameResp { // → 32c9
  optional int32 ret = 1;
  optional ComposeBallSyncData syncData = 2;
}

message ComposeBallComposeData {
  optional int32 ballA = 1;
  optional int32 ballB = 2;
  optional ComposeBallBallData ball = 3;        // the merged result ball
  repeated ComposeBallBallData processBall = 4; // client physics trail
}

message ComposeBallComposeCount {
  optional int32 configId = 1;
  optional int32 count = 2;
}

message ComposeBallSyncData {
  optional bool gameOver = 1;
  optional int32 id = 2;             // next drop's ball id (client counter)
  optional int32 configId = 3;       // next fruit config
  repeated ComposeBallBallData balls = 4;
  repeated ComposeBallComposeCount count = 5;
  optional ComposeBallUserDataSync syncData = 6;
}

message ComposeBallAchieveData {
  optional int32 conditionId = 1;
  optional int32 exceedRate = 2;
}

message ComposeBallComposeReq { // 213002 — full board upload every settle (merges optional: a plain drop sends balls only)
  optional int32 activityId = 1;
  repeated ComposeBallBallData balls = 2;
  repeated ComposeBallComposeData composeData = 3;
  optional string ballsCheck = 4; // md5(SALT + concat(all ball position strings))
}

message ComposeBallComposeResp { // → 32ca
  optional int32 ret = 1;
  optional ComposeBallSyncData syncData = 2;
  repeated ComposeBallAchieveData achieveData = 3;
}

message ComposeBallUseItemReq { // 213003 — itemType 1 clear, 2 swap (idA,idB), 3 level-up, 4 merge-all
  optional int32 activityId = 1;
  optional int32 itemType = 2;
  optional int32 idA = 3;
  optional int32 idB = 4;
  repeated ComposeBallBallData balls = 5;
  repeated ComposeBallComposeData composeData = 6;
  optional string ballsCheck = 7;
}

message ComposeBallUseItemResp { // → 32cb
  optional int32 ret = 1;
  optional ComposeBallSyncData syncData = 2;
  repeated ComposeBallAchieveData achieveData = 3;
}

message ComposeBallHpItemReq { // 213004 — buy stamina with items
  optional int32 activityId = 1;
  optional int32 num = 2;
}

message ComposeBallHpItemResp { // → 32cc
  optional int32 ret = 1;
  optional ComposeBallUserDataSync sync = 2;
}

message ComposeBallSettleReq { // 213005 — end round, report score
  optional int32 activityId = 1;
}

message ComposeBallSettleResp { // → 32cd
  optional int32 ret = 1;
  optional int32 score = 2;
  optional int32 rank = 3;
  optional int32 nextRankScoreGap = 4;
  optional ComposeBallUserDataSync sync = 5;
}

