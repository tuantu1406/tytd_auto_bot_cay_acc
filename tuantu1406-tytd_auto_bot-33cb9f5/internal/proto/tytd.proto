// ---------------------------------------------------------------------------
// Holy Land (thánh địa / 九幽争霸) event — schemas from
// ../remoteHolyLand/HOLY_LAND_PROTOCOL.md + HolyLand.decoded.proto. Only the
// fields we consume are declared; proto3 skips the rest as unknown.
//
// WIRE NOTE: HolyLand carries NO activityId anywhere. Officially-proto2
// `required` request fields that can legitimately carry a zero/false value
// (useItem=false free rebirth, auto-attack targetId=0 = off, isNpc=false) are
// declared proto3 `optional` and are ALWAYS set explicitly by the caller —
// proto3 optional keeps presence, so the field still serializes at its
// default value, which a strict proto2 server parser demands.
// ---------------------------------------------------------------------------

// 209501 base info, 209520 heartbeat, 209521 game info, 209570 schedule,
// 209511 worship, 209508/209509 rank reward — the client sends zero-byte
// bodies; marshal one of these and the payload is empty.
message HolyLandBaseInfoReqMsg {}
message HolyLandHeartBeatReqMsg {}
message HolyLandGameInfoReqMsg {}
message HolyLandBattleApplyDataSyncReq {}
message HolyLandWorshipReq {}
message HolyLandPlayerUnionRankRewardReqMsg {}
message HolyLandGetPlayerUnionRankRewardReqMsg {}

message HolyLandBaseInfoRespMsg {
  optional int32 ret = 1;
  optional int32 selfRank = 2;
  optional int32 group = 3;
  optional int32 gameType = 4;
  optional int64 unionId = 5;
  optional bool canWorship = 11;
}

message HolyLandHeartBeatRespMsg {
  optional int32 ret = 1;
  optional int32 rank = 2;
}

// resp of 209521 (incoming 2531) — the state spine. location==0 means the
// unit is dead unless leftOut; myRouteInfo != nil means marching;
// rebirthData mirrors the BEEN_KILL push (rebirthTime = revive deadline).
message HolyLandGameInfoRespMsg {
  optional int32 ret = 1;
  optional string fightValue = 3;
  optional HolyLandBeenKillSyncMsg rebirthData = 4;
  optional HolyLandGameRouteInfo myRouteInfo = 5;
  optional int32 itemRebirthCount = 6;
  optional bool leftOut = 7;
  optional int32 location = 8;
  optional int32 speedUpCount = 9;
  optional bool haveCommand = 11;
  optional int32 curPower = 12;
  optional int64 attackCd = 13;
  optional int32 unionPointRank = 14;
  optional int32 freeRebirthCount = 15;
  optional int32 autoAtkCityId = 17;
  optional int32 realmsType = 18;
}

// One march route (ours when embedded in game info; anyone's in route syncs).
message HolyLandGameRouteInfo {
  optional int64 playerId = 1;
  optional int32 fromCityId = 2;
  optional int32 toCityId = 3;
  optional int64 time = 4;
  optional int64 arrival = 5;
  optional int64 unionId = 6;
  optional string name = 9;
}

message HolyLandGameMoveReqMsg {
  int32 targetId = 1; // never 0 — plain proto3 field always serializes
}

message HolyLandGameMoveRespMsg {
  optional int32 ret = 1;
}

// 209533 battle: isNpc required officially — always set explicitly (false =
// attack the player-held city, true = hit the NPC guard).
message HolyLandGameAtkReqMsg {
  optional int32 targetId = 1;
  optional int64 enemyId = 2;
  optional bool isNpc = 3;
}

message HolyLandGameAtkRespMsg {
  optional int32 ret = 1;
}

// 209537 auto-attack托管: targetId 0 = stop — always set explicitly so the
// zero reaches the server.
message HolyLandGameAutoAttackReqMsg {
  optional int32 targetId = 1;
}

message HolyLandGameAutoAttackRespMsg {
  optional int32 ret = 1;
  optional int32 targetId = 2;
}

// 209531 accelerate: speedUpCount must equal our current counter (server
// validates the baseline).
message HolyLandGameAcclerateMoveReqMsg {
  optional int32 speedUpCount = 1;
}

message HolyLandGameAcclerateMoveRespMsg {
  optional int32 ret = 1;
  optional string costInfo = 2;
  optional int32 speedUpCount = 3;
}

// 209532 rebirth: useItem false = free (cooldown-gated), true = item (fast).
message HolyLandGameBackHomeReq {
  optional bool useItem = 1;
}

message HolyLandGameBackHomeRespMsg {
  optional int32 ret = 1;
  optional int32 freeRebirthCount = 2;
  optional int32 itemRebirthCount = 3;
}

// 209526 minimap; gameType/group omitted lets the server pick our bracket.
message HolyLandGameMiniMapInfoReqMsg {
  optional int32 gameType = 1;
  optional int32 group = 2;
}

// UnionBaseData subset: owner id/name (and flag/serverId for future use).
// Presence of baseData marks the city as owned.
